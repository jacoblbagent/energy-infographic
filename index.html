<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Energy Value Chain — Public Companies</title>
<style>
  :root{
    --bg:#FBFBFA;--ink:#0F172A;--muted:#5B6B7C;--faint:#93A2B3;
    --line:#DFE5EC;--node:#FFFFFF;--chip:#F7F9FB;--chipb:#E6EBF1;
    --fossil:#C2410C;--lowc:#0E9F6E;--infra:#2563EB;--svc:#64748B;--use:#334155;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }

  /* value-chain switcher: one tab per chain the diagram can draw ("All" is the
     full energy chain, "AI" is the compute/AI chain). */
  #topbar{flex:0 0 auto;display:flex;align-items:center;gap:11px;
    padding:10px 15px;border-bottom:1px solid var(--line);background:#fff}
  .vtabs{display:flex;gap:2px;background:#F1F4F8;border-radius:7px;padding:2px}
  .vtab{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;
    color:#5B6B7C;padding:6px 16px;border-radius:5px;cursor:pointer;letter-spacing:.2px}
  .vtab:hover{color:var(--ink)}
  .vtab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.09)}
  .vtab:focus{outline:none}
  .vtab:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .vwho{font-size:11px;font-weight:500;color:var(--faint)}

  /* stage (diagram) + panel side by side; the panel is a real column, so the
     diagram reflows instead of being covered. */
  #app{flex:1;min-height:0;display:flex;overflow:hidden}
  #stage{flex:1;min-width:0;overflow:auto;display:flex;align-items:center;justify-content:center}
  svg{display:block;width:100%;min-width:900px;height:auto}

  .col-title{font-size:10px;font-weight:700;letter-spacing:1.5px;fill:var(--faint)}
  .node-box{fill:var(--node);stroke:var(--line);stroke-width:1}
  .node-label{font-size:12.5px;font-weight:600;fill:var(--ink)}

  .chip-box{fill:var(--chip);stroke:var(--chipb);stroke-width:1;transition:fill .16s,stroke .16s}
  .chip-text{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:#42526A;
    letter-spacing:.2px;pointer-events:none}
  .chip{cursor:pointer}
  .chip:hover .chip-box{fill:#EDF2F7;stroke:#B9C6D4}
  .chip:hover .chip-text{fill:var(--ink)}
  .chip.sel .chip-box{fill:var(--t);stroke:var(--c);stroke-width:1.4}
  .chip.sel .chip-text{fill:var(--c)}
  .chip:focus{outline:none}
  .chip:focus-visible .chip-box{stroke:var(--ink);stroke-width:1.4}

  .g-node{transition:opacity .18s,stroke .18s}
  .g-node.dim{opacity:.2}
  .g-node.pin .node-box{stroke:#AEBBC8;stroke-width:1.4}

  .edge{fill:none;stroke:#A9B6C4;stroke-width:1;transition:opacity .18s,stroke .18s,stroke-width .18s}
  .edge.dim{opacity:.07}
  .edge.hl{opacity:1;stroke-width:1.7;stroke:#334155}
  .edge-lbl{font-size:9px;font-weight:600;fill:#7B8A9B;letter-spacing:.1px;opacity:0;
    transition:opacity .18s;paint-order:stroke;stroke:var(--bg);stroke-width:3;stroke-linejoin:round}
  .edge-lbl.on{opacity:1}
  .edge-lbl.static{opacity:1}
  .edge-lbl.fade{opacity:.13}

  .svc{stroke:#B7C1CD;stroke-dasharray:3 4}
  .cap{stroke:#DDBBA4;stroke-dasharray:4 5}
  .cap-lbl{font-size:9px;font-weight:700;fill:#B57A4E;letter-spacing:.6px}

  .band-box{fill:#FCFDFE;stroke:#E6EBF1;stroke-width:1;stroke-dasharray:3 4}
  .band-lbl{font-size:10.5px;font-weight:700;fill:#5B6B7C;letter-spacing:.6px}
  .foot{font-size:9.5px;fill:#A3AFBC}
  .legend-t{font-size:10px;font-weight:600;fill:var(--muted);letter-spacing:.2px}

  /* ---- company panel ---- */
  #panel{flex:0 0 auto;width:0;overflow:hidden;background:#fff;
    border-left:1px solid transparent;transition:width .22s ease,border-color .22s}
  #panel.open{width:400px;border-left-color:var(--line)}
  .pin{width:400px;height:100%;overflow-y:auto;padding:26px 26px 40px;position:relative}
  #pClose{position:absolute;top:20px;right:20px;width:26px;height:26px;padding:0;
    border:0;border-radius:6px;background:transparent;color:#A3AFBC;font-size:18px;
    line-height:1;cursor:pointer}
  #pClose:hover{background:#F1F5F9;color:var(--ink)}
  .tkr{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:.4px;
    display:flex;align-items:center;gap:9px}
  .tkr .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .cname{font-size:16.5px;font-weight:600;margin:3px 0 5px;letter-spacing:-.1px}
  .sect{margin-top:19px;padding-top:15px;border-top:1px solid var(--line)}
  .sect[hidden]{display:none}
  .sl{font-size:9.5px;font-weight:700;letter-spacing:1.3px;color:#A3AFBC;
    text-transform:uppercase;margin:0 0 10px}
  .disc>summary{cursor:pointer;list-style:none;display:flex;align-items:center;
    margin:0;user-select:none}
  .disc>summary::-webkit-details-marker{display:none}
  .disc>summary:hover{color:#6B7A8C}
  .disc>summary::after{content:"+";margin-left:auto;font-size:13px;font-weight:700;
    letter-spacing:0;color:#B6C1CC}
  .disc[open]>summary::after{content:"\2013"}
  .disc>div{margin-top:10px}
  .about{font-size:12.5px;line-height:1.55;color:#42526A;margin:0}
  .frow{display:flex;gap:7px;align-items:baseline;font-size:12.5px;color:#42526A;
    margin-bottom:7px;line-height:1.35}
  .frow .ar{color:#A9B6C4;flex:0 0 auto}
  .frow .lb{color:#8A99AA;font-size:11px}
  .muted{font-size:12px;color:#A3AFBC;font-style:italic}
  /* ---- direct competitors ---- */
  .sc{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#C3CCD6;
    letter-spacing:0;margin-left:5px}
  .pbasis{font-size:10.5px;color:#8A99AA;margin:0 0 8px}
  .prow{display:grid;grid-template-columns:44px 1fr;column-gap:8px;row-gap:2px;
    align-items:baseline;width:100%;padding:5px 6px;border:0;border-radius:6px;
    background:none;font:inherit;text-align:left;cursor:pointer}
  .prow:hover{background:#F5F8FB}
  .prow .ptk{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#334155;
    letter-spacing:.2px}
  .prow .pn{font-size:12px;color:#42526A;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .prow .pw{grid-column:2;font-size:10.5px;color:#A3AFBC}
  .prow.off{cursor:default}
  .prow.off:hover{background:none}
  .prow.off .ptk,.prow.off .pn{color:#8A99AA}
  .prow .ptk.dim{color:#C8D1DA}
  .pfoot{font-size:10px;color:#B6C1CC;line-height:1.5;margin-top:9px}
  .fact{display:grid;grid-template-columns:82px 1fr;gap:8px;margin-bottom:7px;
    font-size:12.5px;line-height:1.35}
  .fact .k{font-size:9.5px;font-weight:700;letter-spacing:.6px;color:#A3AFBC;
    text-transform:uppercase;padding-top:2px}
  .fact .v{color:#334155}
  .fact .yr{color:#A3AFBC;font-size:11px}
  .nit{margin-bottom:13px}
  .nit:last-child{margin-bottom:4px}
  .nit a{font-size:12.5px;line-height:1.4;color:#1F3A5F;text-decoration:underline;
    text-decoration-color:#C7D2DE;text-underline-offset:2px;font-weight:500}
  .nit a:hover{color:#0F172A;text-decoration-color:#0F172A}
  .meta{font-size:10.5px;color:#A3AFBC;margin-top:3px}
  .lnks{display:flex;flex-wrap:wrap;gap:6px 14px}
  .lnk{font-size:12px;color:#42526A;text-decoration:none;border-bottom:1px solid #D8E0E8;
    padding-bottom:1px}
  .lnk:hover{color:#0F172A;border-bottom-color:#0F172A}
  .asof{font-size:9.5px;color:#B6C1CC;margin-top:20px;line-height:1.5}

  /* ---- market rail: top-volume feed + merged ticker news ---- */
  #rail{flex:0 0 auto;width:320px;background:#fff;border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
    transition:width .22s ease,border-color .22s}
  /* collapsed: the rail stays put as a slim strip with its toggle pinned at the
     top, so the way back is always in the same place */
  body.railoff #rail{width:44px}
  body.railoff .tabs,body.railoff .railbody{display:none}
  body.railoff .railhead{width:44px;justify-content:center;padding:13px 0 11px;
    border-bottom-color:transparent}
  body.railoff #railToggle{color:#7B8A9B}
  .railhead{display:flex;align-items:center;gap:8px;flex:0 0 auto;
    padding:13px 12px 11px;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:2px;flex:1;background:#F1F4F8;border-radius:7px;padding:2px}
  .tab{flex:1;border:0;background:transparent;font:inherit;font-size:11.5px;font-weight:600;
    color:#5B6B7C;padding:5px 8px;border-radius:5px;cursor:pointer;letter-spacing:.1px}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.09)}
  #railToggle{flex:0 0 auto;width:24px;height:24px;padding:0;border:0;border-radius:6px;
    background:transparent;color:#A3AFBC;font-size:16px;line-height:1;cursor:pointer}
  #railToggle:hover{background:#F1F5F9;color:var(--ink)}
  .railbody{flex:1;min-height:0;overflow-y:auto;padding:11px 12px 34px}
  .railnote{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
    color:#B6C1CC;margin:1px 2px 8px}

  .vrow{display:grid;grid-template-columns:18px 46px 1fr;column-gap:8px;row-gap:3px;
    align-items:center;width:100%;padding:6px;border:0;border-radius:6px;background:none;
    font:inherit;text-align:left;cursor:pointer}
  .vrow:hover{background:#F5F8FB}
  .vrow.sel,.vrow.sel:hover{background:#E8F0FA}
  .vrk{font-family:var(--mono);font-size:10px;color:#B6C1CC;text-align:right}
  .vtk{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#334155;letter-spacing:.2px}
  .vnm{font-size:11.5px;color:#8A99AA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vfoot{grid-column:2 / 4;display:flex;align-items:center;gap:8px}
  .vbar{flex:1;min-width:24px;height:4px;border-radius:2px;background:#EDF1F6;overflow:hidden}
  .vbar i{display:block;height:100%;background:#A7B9CB;border-radius:2px}
  .vvol{font-family:var(--mono);font-size:10px;color:#7B8A9B}
  .vchg{font-family:var(--mono);font-size:10px;font-weight:600}
  .up{color:#0E9F6E}.dn{color:#C2410C}.flat{color:#93A2B3}

  .newsbar{display:flex;gap:6px;margin-bottom:6px}
  #newsQ{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 8px;
    font:inherit;font-size:11.5px;color:var(--ink);background:#FBFCFD}
  #newsQ:focus{outline:none;border-color:#C3CEDB;background:#fff}
  .sorts{display:flex;background:#F1F4F8;border-radius:6px;padding:2px}
  .sort{border:0;background:none;font:inherit;font-size:10.5px;font-weight:600;color:#5B6B7C;
    padding:4px 7px;border-radius:4px;cursor:pointer}
  .sort.on{background:#fff;color:var(--ink)}
  .nrow{padding:9px 4px;border-bottom:1px solid #F0F3F7}
  .nrow:last-child{border-bottom:0}
  .nt{display:block;font-size:12px;line-height:1.4;font-weight:500;color:#1F3A5F;
    text-decoration:none}
  .nt:hover{color:#0F172A;text-decoration:underline;text-decoration-color:#C7D2DE;
    text-underline-offset:2px}
  .nmeta{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:10px;color:#A3AFBC}
  .ntk{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.2px;
    padding:1px 5px;border:0;border-radius:4px;background:#F1F4F8;color:#42526A;cursor:pointer}
  .ntk:hover{background:#E6EBF1;color:var(--ink)}
  .ntk.sel,.ntk.sel:hover{background:#D9E6F6;color:#0F172A}
  .nmore,.nempty{display:block;width:100%;margin-top:10px;padding:7px;border:1px solid var(--line);
    background:#fff;border-radius:6px;font:inherit;font-size:11px;font-weight:600;
    color:#42526A;cursor:pointer;text-align:center}
  .nmore:hover{background:#F5F8FB}
  .nempty{border:0;color:#A3AFBC;font-weight:500;cursor:default}

  @media (max-width:1180px){
    /* narrow: the panel and the rail overlay rather than crushing the diagram */
    #panel{position:fixed;top:0;right:0;height:100%;z-index:35;
      box-shadow:-14px 0 30px rgba(15,23,42,.10);transition:transform .22s ease,width 0s}
    #panel{width:340px;transform:translateX(100%)}
    #panel.open{width:340px;transform:translateX(0)}
    .pin{width:340px}

    #rail{position:fixed;top:0;right:0;height:100%;z-index:30;width:330px;
      box-shadow:-14px 0 30px rgba(15,23,42,.10);transform:translateX(0);
      transition:transform .22s ease}
    body.railoff #rail{width:330px;transform:translateX(calc(100% - 44px));
      box-shadow:-6px 0 16px rgba(15,23,42,.08)}
  }
</style>
</head>
<body>
<div id="topbar">
  <div class="vtabs" role="tablist" aria-label="Value chain">
    <button class="vtab on" type="button" role="tab" aria-selected="true"
      data-view="energy">All</button>
    <button class="vtab" type="button" role="tab" aria-selected="false"
      data-view="ai">AI</button>
  </div>
  <div class="vwho" id="vWho"></div>
</div>
<div id="app">
  <div id="stage"><svg id="svg" viewBox="0 0 1660 1000" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="panel" aria-live="polite" aria-label="Company details">
    <div class="pin">
      <button id="pClose" type="button" title="Close (Esc)" aria-label="Close">&times;</button>
      <div class="tkr" id="pTar"></div>
      <div class="cname" id="pName"></div>
      <div class="sect">
        <div class="sl">About</div>
        <p class="about" id="pAbout"></p>
      </div>

      <details class="sect disc" id="secFacts">
        <summary class="sl">Company</summary>
        <div id="pFacts"></div>
      </details>

      <details class="sect disc" id="secFlows">
        <summary class="sl">Flows</summary>
        <div id="pFlows"></div>
      </details>

      <details class="sect disc" id="secPeers">
        <summary class="sl">Direct competitors <span class="sc" id="pPeerN"></span></summary>
        <div id="pPeers"></div>
      </details>

      <div class="sect">
        <div class="sl">Recent news</div>
        <div id="pNews"></div>
      </div>

      <div class="sect" id="secLinks">
        <div id="pLinks"></div>
      </div>

      <div class="asof" id="pAsof"></div>
    </div>
  </aside>

  <!-- market rail: a persistent right-hand section with two tabs — the live
       volume leaderboard and a merged, prioritised news feed over every ticker
       the diagram lists. Rows open the same company panel a chip click does. -->
  <aside id="rail" aria-label="Market feed">
    <div class="railhead">
      <div class="tabs" role="tablist">
        <button class="tab on" type="button" role="tab" aria-selected="true"
          data-tab="vol">Volume</button>
        <button class="tab" type="button" role="tab" aria-selected="false"
          data-tab="news">News</button>
      </div>
      <button id="railToggle" type="button" title="Hide the feed">&rsaquo;</button>
    </div>
    <div class="railbody">
      <div id="volPane" role="tabpanel">
        <div class="railnote" id="volAsOf"></div>
        <div id="volList"></div>
      </div>
      <div id="newsPane" role="tabpanel" hidden>
        <div class="newsbar">
          <input id="newsQ" type="search" placeholder="Filter ticker or name"
            aria-label="Filter headlines by ticker or company name">
          <div class="sorts" role="group" aria-label="Sort order">
            <button class="sort on" type="button" data-sort="pri">Priority</button>
            <button class="sort" type="button" data-sort="new">Newest</button>
          </div>
        </div>
        <div id="newsList"></div>
      </div>
    </div>
  </aside>
</div>

/* ---------- capital loop ---------- */
function roundPath(pts,r){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    const v1=[p1[0]-p0[0],p1[1]-p0[1]],v2=[p2[0]-p1[0],p2[1]-p1[1]];
    const l1=Math.hypot(v1[0],v1[1]),l2=Math.hypot(v2[0],v2[1]);
    const rr=Math.min(r,l1/2,l2/2);
    const a=[p1[0]-v1[0]/l1*rr,p1[1]-v1[1]/l1*rr];
    const b=[p1[0]+v2[0]/l2*rr,p1[1]+v2[1]/l2*rr];
    d+=` L${a[0]},${a[1]} Q${p1[0]},${p1[1]} ${b[0]},${b[1]}`;
  }
  const L=pts[pts.length-1]; return d+` L${L[0]},${L[1]}`;
}

      row.items.forEach(it=>{
        const cg=el("g",{class:"chip",tabindex:"0",role:"button"},g);
        cg.setAttribute("aria-label",it.t+" — "+coName(it.t));
        el("rect",{x:cx,y:yy,width:it.w,height:CH,rx:5,class:"chip-box"},cg);
        const tx=el("text",{x:cx+it.w/2,y:yy+CH/2+3.7,class:"chip-text","text-anchor":"middle"},cg);
        tx.textContent=it.t;
        bindChip(cg,it.t,n.id);
        cx+=it.w+CGAP;
      });
      yy+=CH+CGAP;
    });
    yy-=CGAP;
  }
  g.addEventListener("mouseenter",()=>{ if(!picked) focus(n.id); });
  g.addEventListener("mouseleave",()=>{ if(!picked) blur(); });
  /* Clicking the card itself (chips stop propagation and open the panel) pins
     this node's path. Hover previews are suppressed while something is pinned,
     so the trace cannot shift until the user clicks away from it. */
  g.addEventListener("click",ev=>{ ev.stopPropagation(); pinNode(n.id); });
});

/* column headers, titles, legend and footer are painted by paintChrome(), which
   sits below with the panel helpers (the two halves of the drawing code are
   separated by the interaction code, so the chrome is a second function) */
paintChrome();
}

/* ---------- trace on hover ---------- */
function focus(id){
  const near={}; near[id]=1;
  EDGES.forEach(e=>{ if(e.a===id)near[e.b]=1; if(e.b===id)near[e.a]=1; });
  EDGES.forEach(e=>{
    const on=(e.a===id||e.b===id);
    e.el.classList.toggle("hl",on); e.el.classList.toggle("dim",!on);
    e.lbl.classList.toggle("on",on); e.lbl.classList.toggle("fade",!on);
  });
  NODES.forEach(n=>n.gEl.classList.toggle("dim",!near[n.id]));
}
function blur(){
  EDGES.forEach(e=>{e.el.classList.remove("hl","dim");
    e.lbl.classList.remove("on","fade");});
  NODES.forEach(n=>n.gEl.classList.remove("dim"));
}

/* ---------- hover tooltip ---------- */
const tip=document.createElement("div");
tip.id="tip";
tip.style.cssText="position:fixed;pointer-events:none;background:#0F172A;color:#fff;font-size:11.5px;"+
  "font-weight:500;line-height:1.25;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .12s;"+
  "white-space:nowrap;z-index:40;transform:translate(12px,12px)";
document.body.appendChild(tip);

/* ---------- chips: hover tip + click → panel ---------- */
let picked=null;
function bindChip(nodeEl,tk,nodeId){
  const g=byId[nodeId]?byId[nodeId].g:(ENABLERS.find(e=>e.id===nodeId)||{}).g||"svc";
  nodeEl.style.setProperty("--c",G[g]);
  nodeEl.style.setProperty("--t",TINT[g]);
  nodeEl.addEventListener("mouseenter",()=>{
    const nm=coName(tk);
    tip.innerHTML=`<span style="font-family:var(--mono);font-weight:700;color:#BFD3EA">${tk}</span>`+
      (nm===tk?"":`&nbsp;&nbsp;${nm}`);
    tip.style.opacity="1";
  });
  nodeEl.addEventListener("mousemove",ev=>{tip.style.left=ev.clientX+"px";tip.style.top=ev.clientY+"px";});
  nodeEl.addEventListener("mouseleave",()=>{tip.style.opacity="0";});
  nodeEl.addEventListener("click",ev=>{ev.stopPropagation();pick(tk,nodeId,nodeEl);});
  nodeEl.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick(tk,nodeId,nodeEl);}
  });
}

/* ---------- company panel ---------- */
const panel=document.getElementById("panel");
const $=id=>document.getElementById(id);
document.getElementById("pClose").onclick=()=>clearSel();
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") clearSel(); });
svg.addEventListener("click",()=>clearSel());   // a click on empty canvas clears it

function pick(tk,nodeId,chipEl){
  const name=coName(tk), about=coAbout(tk);
  const node=byId[nodeId]||null;
  const gcol=node?G[node.g]:G.svc;
  const D=(typeof DATA!=="undefined"&&DATA[tk])||{};
  picked={tk:tk,nodeId:nodeId};
  markPin(nodeId);
  markRailSel(tk);

  $("pTar").innerHTML=`<span class="dot" style="background:${gcol}"></span>${tk}`;
  const nmEl=$("pName");
  nmEl.textContent=(name===tk?"":name);
  nmEl.style.display=(name===tk?"none":"");
  $("pAbout").textContent=about;

  /* company facts — only what could actually be sourced */
  const ind=D.industry?D.industry.charAt(0).toUpperCase()+D.industry.slice(1):null;
  const facts=[["Listed",D.listed],["Industry",ind],["HQ",D.hq],
               ["Founded",D.founded?String(D.founded):null],
               ["Employees",D.employees?[fmtNum(D.employees),D.employeesYear]:null]];
  const fx=$("pFacts"); fx.innerHTML="";
  const rows=facts.filter(f=>f[1]);
  rows.forEach(f=>fx.appendChild(fact(f[0],f[1])));
  $("secFacts").hidden=!rows.length;

  /* flows — collapsed by default each time a company opens */
  $("secFlows").open=false;
  const flow=$("pFlows"); flow.innerHTML="";
  if(node){
    const out=EDGES.filter(e=>e.a===node.id), inn=EDGES.filter(e=>e.b===node.id);
    out.forEach(e=>flow.appendChild(row("→",byId[e.b].label,e.l)));
    inn.forEach(e=>flow.appendChild(row("←",byId[e.a].label,e.l)));
    if(!out.length&&!inn.length) flow.appendChild(muted("A terminal stage — no outgoing flows."));
  }else{
    flow.appendChild(row("→","Every stage of the chain","services · equipment · materials"));
  }

  /* direct competitors — same line of business, from data/competitors.json.
     A peer that is on the chart opens its own panel; one that is not is listed
     as plain text (the diagram has no chip to select). */
  $("secPeers").open=false;
  const pw=$("pPeers"); pw.innerHTML="";
  const P=(typeof PEERS!=="undefined"&&PEERS[tk])||null;
  const nPeer=(P&&P.peers)?P.peers.length:0;
  $("pPeerN").textContent=nPeer?String(nPeer):"";
  if(nPeer){
    const b=document.createElement("div"); b.className="pbasis";
    b.textContent=P.basis; pw.appendChild(b);
    P.peers.forEach(p=>pw.appendChild(peerRow(p)));
    if(P.note) pw.appendChild(muted(P.note));
    const ft=document.createElement("div"); ft.className="pfoot";
    ft.textContent=(typeof PEERS_NOTE!=="undefined")?PEERS_NOTE:"";
    pw.appendChild(ft);
  }else pw.appendChild(muted("No direct competitor identified in this segment."));
  $("secPeers").hidden=!nPeer;

  /* recent news */
  const nw=$("pNews"); nw.innerHTML="";
  const news=D.news||[];
  if(news.length) news.forEach(it=>nw.appendChild(newsItem(it)));
  else nw.appendChild(muted("No recent headlines found."));
  nw.appendChild(moreNews(name));

  /* links */
  const lk=$("pLinks"); lk.innerHTML="";
  const rowEl=document.createElement("div"); rowEl.className="lnks";
  if(D.site) rowEl.appendChild(linkOut("Website",D.site));
  if(D.wiki) rowEl.appendChild(linkOut("Wikipedia",
    "https://en.wikipedia.org/wiki/"+encodeURIComponent(D.wiki.replace(/ /g,"_"))));
  if(rowEl.childNodes.length){ lk.appendChild(rowEl); $("secLinks").hidden=false; }
  else $("secLinks").hidden=true;

  /* provenance */
  $("pAsof").textContent=(news.length
    ? `Headlines via Google News, as of ${fmtDate(NEWS_ASOF)}. `
    : "")+"Facts from Wikidata and Wikipedia.";

  document.querySelectorAll(".chip.sel").forEach(c=>c.classList.remove("sel"));
  chipEl.classList.add("sel");
  if(node) focus(node.id); else blur();
  panel.classList.add("open");
  document.body.classList.add("panelopen");
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(s){
  const p=String(s||"").split("-");
  return p.length===3?((+p[2])+" "+MON[(+p[1])-1]+" "+p[0]):(s||"");
}
function fmtNum(n){ return Number(n).toLocaleString("en-US"); }
function fact(k,v){
  const d=document.createElement("div"); d.className="fact";
  const a=document.createElement("span"); a.className="k"; a.textContent=k;
  const b=document.createElement("span"); b.className="v";
  if(Array.isArray(v)){
    b.textContent=v[0];
    if(v[1]){ const y=document.createElement("span"); y.className="yr";
      y.textContent=" "+v[1]; b.appendChild(y); }
  } else b.textContent=v;
  d.append(a,b); return d;
}
function row(ar,label,note){
  const d=document.createElement("div"); d.className="frow";
  const a=document.createElement("span"); a.className="ar"; a.textContent=ar;
  const s=document.createElement("span");
  s.textContent=label+(note?" ":"");
  if(note){const n=document.createElement("span");n.className="lb";n.textContent=" · "+note;s.appendChild(n);}
  d.append(a,s);return d;
}
function muted(t){const d=document.createElement("div");d.className="muted";d.textContent=t;return d;}
function peerRow(p){
  const onChart=p.t&&typeof CHART_TK!=="undefined"&&CHART_TK.map[p.t]!==undefined;
  const name=(p.t&&CO[p.t]&&CO[p.t][0])||p.n||p.t||"";
  let e;
  if(onChart){
    e=document.createElement("button"); e.type="button"; e.className="prow";
    e.dataset.tk=p.t; e.title="Open "+name;
    e.setAttribute("aria-label","Open "+p.t+" — "+name);
    e.addEventListener("click",()=>openCompany(p.t));
  }else{
    e=document.createElement("div"); e.className="prow off";
  }
  const tkSpan=document.createElement("span");
  tkSpan.className="ptk"+(p.t?"":" dim");
  tkSpan.textContent=p.t||"—";
  const nm=document.createElement("span"); nm.className="pn"; nm.textContent=name;
  const wy=document.createElement("span"); wy.className="pw";
  wy.textContent=(p.w||"")+(onChart?"":" · off-chart");
  e.append(tkSpan,nm,wy);
  return e;
}
function newsItem(it){
  const d=document.createElement("div"); d.className="nit";
  const a=document.createElement("a");
  a.href=it.u; a.target="_blank"; a.rel="noopener"; a.textContent=it.t;
  const m=document.createElement("div"); m.className="meta";
  m.textContent=[it.s,fmtDate(it.d)].filter(Boolean).join(" · ");
  d.append(a,m); return d;
}
function moreNews(name){
  const d=document.createElement("div"); d.className="lnks"; d.style.marginTop="13px";
  d.appendChild(linkOut("More news","https://news.google.com/search?q="+encodeURIComponent(name)));
  return d;
}
function linkOut(label,href){
  const a=document.createElement("a"); a.className="lnk"; a.textContent=label+" ↗";
  a.href=href; a.target="_blank"; a.rel="noopener"; return a;
}
/* Pins are sticky: a node card click pins the trace, a chip click pins it and
   opens the panel, and only clicking away (background, another node/chip, Esc,
   the × ) releases it. Hovering elsewhere does not disturb a pin. */
function pinNode(id){
  const same=(picked&&picked.nodeId===id);
  picked={nodeId:id, tk:same?picked.tk:null};
  if(!same){
    document.querySelectorAll(".chip.sel").forEach(c=>c.classList.remove("sel"));
    panel.classList.remove("open");
    document.body.classList.remove("panelopen");
  }
  markPin(id);
  markRailSel(picked.tk||null);
  focus(id);
}
function markPin(id){
  document.querySelectorAll(".g-node").forEach(g=>
    g.classList.toggle("pin",!!id&&g.dataset.id===id));
}
/* mirrors the open company onto the rail rows/ticker buttons, so the row you
   toggled reads as selected — and its second click is a visible close. */
function markRailSel(tk){
  document.querySelectorAll("#rail .vrow,#rail .ntk").forEach(el=>
    el.classList.toggle("sel",!!tk&&el.dataset.tk===tk));
}
function clearSel(){
  picked=null;
  panel.classList.remove("open");
  document.body.classList.remove("panelopen");
  document.querySelectorAll(".chip.sel").forEach(c=>c.classList.remove("sel"));
  markPin(null);
  markRailSel(null);
  blur();
}

/* ---------- chrome for the active view ---------- */
function paintChrome(){
const COL_TITLES=VIEW.colTitles, CX=VIEW.cx, NW=VIEW.nw;
/* ---------- column headers ---------- */
CX.map((_,c)=>c).forEach(c=>{

/* ---------- header / footer / legend ---------- */

h1.textContent=VIEW.title;
const h2=el("text",{x:60,y:118,style:"font-size:12.5px;font-weight:500;fill:#5B6B7C"},svg);

  style:"font-size:10px;font-weight:500;fill:#93A2B3"},svg);

/* the market rail and the company panel read the same universe the active view
   draws, so switching tabs re-points both at the new ticker list */

/* ---------- market rail: top-volume feed + merged ticker news ----------
   Two panes over the same universe the diagram draws (NODES + ENABLERS), so a
   ticker added to the chart shows up here with no extra work.

   Volume   — the VOL snapshot (tools/fetch-market-volume.py) ranked by shares
              traded today, label with the market timestamp it came from.
   News     — every dated headline in DATA[tk].news, merged, de-duplicated and
              ordered by source tier then recency ("Priority") or purely by date
              ("Newest"), filterable to any one ticker.
   A row or a ticker chip opens the same company panel a chip click does. */
const VOLQ=(typeof VOL!=="undefined")?VOL:{};
const VOL_TS=(typeof VOL_ASOF!=="undefined")?VOL_ASOF:"";
const VOL_ST=(typeof VOL_STATUS!=="undefined")?VOL_STATUS:"";
const RAIL={vol:$("volList"),news:$("newsList"),asof:$("volAsOf")};
/* ticker → owning node id for the ACTIVE view, in chart order. Rebuilt by
   buildRailData() on every tab change, so the feed never lists a ticker the
   diagram is not drawing. */
function buildRailData(){
  const map={},order=[];
  NODES.forEach(n=>n.cos.forEach(t=>{ if(!(t in map)){map[t]=n.id;order.push(t);} }));
  ENABLERS.forEach(g=>g.cos.forEach(t=>{ if(!(t in map)){map[t]=g.id;order.push(t);} }));
  CHART_TK={map:map,order:order};
  NEWS.length=0;
  order.forEach(tk=>{
    const D=(typeof DATA!=="undefined"&&DATA[tk])||{};
    (D.news||[]).forEach(n=>NEWS.push({tk:tk,ti:n.t,s:n.s||"",d:n.d||"",u:n.u}));
  });
  dedupeNews();
}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TNAME=t=>((typeof DATA!=="undefined"&&DATA[t]&&DATA[t].name)||
  (VOLQ[t]&&VOLQ[t].n)||(CO[t]&&CO[t][0])||t);
const fmtVol=n=>n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":
  n>=1e3?(n/1e3).toFixed(1)+"K":String(n);

/* Selecting from the rail: drive the panel exactly like a chip click, and
   outline the matching chip so the diagram agrees with the feed. */
function openCompany(tk){
  const id=CHART_TK.map[tk];
  if(id===undefined) return;
  /* clicking the company that is already open toggles the panel shut */
  if(picked&&picked.tk===tk){ clearSel(); return; }
  pick(tk,id,document.createElement("span"));   // detached: the panel needs no chip
  document.querySelectorAll(".chip").forEach(c=>{
    if((c.getAttribute("aria-label")||"").indexOf(tk+" — ")===0) c.classList.add("sel");
  });
  /* on a narrow screen the rail is an overlay: step it aside so the panel
     (which is wider and sits above it) is the only thing on show */
  if(MQ.matches){ setRail(true); }
}

/* ---------- pane 1: most volume right now ---------- */
function fmtAsof(){
  const d=new Date(VOL_TS);
  if(isNaN(d.getTime())) return "Top volume";
  const t=d.toLocaleTimeString("en-US",{timeZone:"America/New_York",
    hour:"numeric",minute:"2-digit",timeZoneName:"short"});
  const dd=d.toLocaleDateString("en-US",{timeZone:"America/New_York",
    day:"numeric",month:"short"});
  const st=(VOL_ST&&VOL_ST!=="REG_MKT")?" · "+VOL_ST.replace(/_/g," ").toLowerCase():"";
  return "Top volume · as of "+t+", "+dd+st;
}
function renderVol(){
  const all=Object.keys(VOLQ).filter(t=>CHART_TK.map[t]!==undefined)
    .map(t=>({t:t,q:VOLQ[t]})).sort((a,b)=>b.q.v-a.q.v);
  RAIL.vol.innerHTML="";
  if(!all.length){
    const e=document.createElement("div"); e.className="nempty";
    e.textContent="No volume snapshot — run tools/fetch-market-volume.py --inject.";
    RAIL.vol.appendChild(e); return;
  }
  const max=all[0].q.v, frag=document.createDocumentFragment();
  all.forEach((r,i)=>{
    const q=r.q;
    const pc=(q.c===undefined||q.c===null)?"—":((q.c>0?"+":"")+q.c.toFixed(2)+"%");
    const cls=(q.c===undefined||q.c===null||Math.abs(q.c)<0.005)?"flat":(q.c>0?"up":"dn");
    const b=document.createElement("button");
    b.type="button"; b.className="vrow"; b.dataset.tk=r.t;
    b.title=r.t+" · "+(q.p!=null?"$"+q.p.toFixed(2)+" · ":"")+(q.x||"");
    b.setAttribute("aria-label",r.t+" — "+TNAME(r.t)+", volume "+(q.va||fmtVol(q.v)));
    b.innerHTML='<span class="vrk">'+(i+1)+'</span>'+
      '<span class="vtk">'+esc(r.t)+'</span>'+
      '<span class="vnm">'+esc(TNAME(r.t))+'</span>'+
      '<span class="vfoot"><span class="vbar"><i style="width:'+
      Math.max(2,Math.round(q.v/max*100))+'%"></i></span>'+
      '<span class="vvol">'+esc(q.va||fmtVol(q.v))+'</span>'+
      '<span class="vchg '+cls+'">'+pc+'</span></span>';
    b.addEventListener("click",()=>openCompany(r.t));
    frag.appendChild(b);
  });
  RAIL.vol.appendChild(frag);
  markRailSel(picked&&picked.tk);
}

/* ---------- pane 2: merged news over every ticker the active view draws ---------- */
const TIER1=/reuters|bloomberg|wall street journal|\bwsj\b|financial times|associated press|\bbarron|new york times|\bnyt\b|washington post|\bcnbc\b|dow jones|the economist/i;
const TIER2=/yahoo|marketwatch|seeking alpha|motley fool|investor's business daily|investopedia|benzinga|zacks|simply wall|business wire|pr newswire|globe ?newswire|oilprice|s&p global|spglobal|utility ?dive|the street|tipranks|insider monkey|forbes|fortune|\bcnn\b|\bbbc\b|streetinsider|oil & gas journal|rigzone|world oil|hydrogen insight|canary media|power magazine|pv magazine|electrek|heatmap|axios|the hill|financial post|energy monitor|argus|hart energy|rbn energy|the wall street|marketwire/i;
const T_NOW=VOL_TS.slice(0,10);
const srcTier=s=>TIER1.test(s)?3:(TIER2.test(s)?2:1);
function ageD(ds){ const a=Date.parse(T_NOW),b=Date.parse(ds);
  return (isNaN(a)||isNaN(b))?999:Math.max(0,Math.round((a-b)/864e5)); }
const prio=n=>srcTier(n.s)*1000-ageD(n.d);
const sigOf=n=>n.ti.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
/* keep one copy of a story: the best-sourced, newest one */
function dedupeNews(){
  const best={};
  NEWS.forEach(n=>{ const k=sigOf(n);
    if(!best[k]||prio(n)>prio(best[k])) best[k]=n; });
  const keep=new Set(Object.values(best));
  for(let i=NEWS.length-1;i>=0;i--) if(!keep.has(NEWS[i])) NEWS.splice(i,1);
}
const NST={q:"",sort:"pri",limit:40};
function newsPick(){
  const q=NST.q.trim().toLowerCase();
  const list=NEWS.filter(n=>!q||n.tk.toLowerCase().indexOf(q)===0||
    TNAME(n.tk).toLowerCase().includes(q));
  list.sort(NST.sort==="new"
    ? (a,b)=>a.d<b.d?1:(a.d>b.d?-1:0)
    : (a,b)=>prio(b)-prio(a)||(a.d<b.d?1:(a.d>b.d?-1:0)));
  return list;
}
function renderNews(){
  const list=newsPick();
  RAIL.news.innerHTML="";
  if(!list.length){
    const e=document.createElement("div"); e.className="nempty";
    e.textContent=NST.q?("No headlines for “"+NST.q+"”."):"No recent headlines.";
    RAIL.news.appendChild(e); return;
  }
  const shown=list.slice(0,NST.limit), frag=document.createDocumentFragment();
  shown.forEach(n=>{
    const d=document.createElement("div"); d.className="nrow";
    const a=document.createElement("a"); a.className="nt";
    a.href=n.u; a.target="_blank"; a.rel="noopener"; a.textContent=n.ti;
    const m=document.createElement("div"); m.className="nmeta";
    const b=document.createElement("button"); b.type="button"; b.className="ntk";
    b.dataset.tk=n.tk;
    b.textContent=n.tk; b.title="Open "+n.tk+" — "+TNAME(n.tk);
    b.addEventListener("click",()=>openCompany(n.tk));
    const s=document.createElement("span");
    s.textContent=[n.s,fmtDate(n.d)].filter(Boolean).join(" · ");
    m.append(b,s); d.append(a,m); frag.appendChild(d);
  });
  RAIL.news.appendChild(frag);
  if(list.length>shown.length){
    const more=document.createElement("button");
    more.type="button"; more.className="nmore";
    more.textContent="Show "+Math.min(40,list.length-shown.length)+
      " more of "+list.length+" headlines";
    more.addEventListener("click",()=>{ NST.limit+=40; renderNews(); });
    RAIL.news.appendChild(more);
  }
  markRailSel(picked&&picked.tk);
}

/* ---------- view tabs, rail tabs, collapse/hide, wiring ---------- */
const VTABS=Array.prototype.slice.call(document.querySelectorAll(".vtab"));
const VWHO=$("vWho");
function tickerCount(v){
  const s=new Set();
  v.nodes.forEach(n=>n.cos.forEach(t=>s.add(t)));
  v.enablers.forEach(g=>g.cos.forEach(t=>s.add(t)));
  return s.size;
}
/* the tab's own state, the one-line summary beside it, and the page title all
   follow the active view */
function markTabs(){
  VTABS.forEach(b=>{const on=b.dataset.view===VIEW.tab;
    b.classList.toggle("on",on); b.setAttribute("aria-selected",on?"true":"false");});
  VWHO.textContent=VIEW.nodes.length+" stages · "+tickerCount(VIEW)+" companies";
  document.title=VIEW.pageTitle+" — Public Companies";
}
VTABS.forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.view!==VIEW.tab) buildView(b.dataset.view);
}));

const TABBTNS=Array.prototype.slice.call(document.querySelectorAll(".tab"));
const PANES={vol:$("volPane"),news:$("newsPane")};
TABBTNS.forEach(b=>b.addEventListener("click",()=>{
  TABBTNS.forEach(x=>{const on=x===b;x.classList.toggle("on",on);
    x.setAttribute("aria-selected",on?"true":"false");});
  PANES.vol.hidden=(b.dataset.tab!=="vol");
  PANES.news.hidden=(b.dataset.tab!=="news");
}));
const TGL=$("railToggle"), BODY=document.body, MQ=window.matchMedia("(max-width:1180px)");
/* one collapsed state for both widths: body.railoff narrows the rail to a strip
   with the toggle still at its top (wide) or slides it off leaving that strip
   (narrow). railOpen stays in charge of the chevron either way. */
function railCollapsed(){ return BODY.classList.contains("railoff"); }
function setRail(collapsed){
  BODY.classList.toggle("railoff",collapsed);
  railGlyph();
}
function railGlyph(){
  const open=!railCollapsed();
  TGL.textContent=open?"\u203a":"\u2039";
  TGL.title=open?"Hide the feed":"Show the feed";
  TGL.setAttribute("aria-expanded",open?"true":"false");
}
function toggleRail(){ setRail(!railCollapsed()); }
TGL.addEventListener("click",toggleRail);
/* keep the default sane per width: narrow opens as a strip, wide stays open */
MQ.addEventListener("change",()=>setRail(MQ.matches));
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&MQ.matches) setRail(true);
});
$("newsQ").addEventListener("input",ev=>{ NST.q=ev.target.value; NST.limit=40; renderNews(); });
Array.prototype.slice.call(document.querySelectorAll(".sort")).forEach(b=>
  b.addEventListener("click",()=>{
    NST.sort=b.dataset.sort; NST.limit=40;
    document.querySelectorAll(".sort").forEach(x=>x.classList.toggle("on",x===b));
    renderNews();
  }));

RAIL.asof.textContent=fmtAsof();
setRail(MQ.matches);
buildView("energy");
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Energy Value Chain — Public Companies</title>
<style>
  :root{
    --bg:#FBFBFA;--ink:#0F172A;--muted:#5B6B7C;--faint:#93A2B3;
    --line:#DFE5EC;--node:#FFFFFF;--chip:#F7F9FB;--chipb:#E6EBF1;
    --fossil:#C2410C;--lowc:#0E9F6E;--infra:#2563EB;--svc:#64748B;--use:#334155;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* stage (diagram) + panel side by side; the panel is a real column, so the
     diagram reflows instead of being covered. */
  #app{display:flex;height:100vh;overflow:hidden}
  #stage{flex:1;min-width:0;overflow:auto;display:flex;align-items:center;justify-content:center}
  svg{display:block;width:100%;min-width:900px;height:auto}

  .col-title{font-size:10px;font-weight:700;letter-spacing:1.5px;fill:var(--faint)}
  .node-box{fill:var(--node);stroke:var(--line);stroke-width:1}
  .node-label{font-size:12.5px;font-weight:600;fill:var(--ink)}
  .node-tag{font-size:10px;font-weight:500;fill:var(--faint);letter-spacing:.2px}

  .chip-box{fill:var(--chip);stroke:var(--chipb);stroke-width:1;transition:fill .16s,stroke .16s}
  .chip-text{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:#42526A;
    letter-spacing:.2px;pointer-events:none}
  .chip{cursor:pointer}
  .chip:hover .chip-box{fill:#EDF2F7;stroke:#B9C6D4}
  .chip:hover .chip-text{fill:var(--ink)}
  .chip.sel .chip-box{fill:var(--t);stroke:var(--c);stroke-width:1.4}
  .chip.sel .chip-text{fill:var(--c)}
  .chip:focus{outline:none}
  .chip:focus-visible .chip-box{stroke:var(--ink);stroke-width:1.4}

  .g-node{transition:opacity .18s}
  .g-node.dim{opacity:.2}

  .edge{fill:none;stroke:#A9B6C4;stroke-width:1;transition:opacity .18s,stroke .18s,stroke-width .18s}
  .edge.dim{opacity:.07}
  .edge.hl{opacity:1;stroke-width:1.7;stroke:#334155}
  .edge-lbl{font-size:9px;font-weight:600;fill:#7B8A9B;letter-spacing:.1px;opacity:0;
    transition:opacity .18s;paint-order:stroke;stroke:var(--bg);stroke-width:3;stroke-linejoin:round}
  .edge-lbl.on{opacity:1}
  .edge-lbl.static{opacity:1}
  .edge-lbl.fade{opacity:.13}

  .svc{stroke:#B7C1CD;stroke-dasharray:3 4}
  .cap{stroke:#DDBBA4;stroke-dasharray:4 5}
  .cap-lbl{font-size:9px;font-weight:700;fill:#B57A4E;letter-spacing:.6px}

  .band-box{fill:#FCFDFE;stroke:#E6EBF1;stroke-width:1;stroke-dasharray:3 4}
  .band-lbl{font-size:10.5px;font-weight:700;fill:#5B6B7C;letter-spacing:.6px}
  .foot{font-size:9.5px;fill:#A3AFBC}
  .legend-t{font-size:10px;font-weight:600;fill:var(--muted);letter-spacing:.2px}

  /* ---- company panel ---- */
  #panel{flex:0 0 auto;width:0;overflow:hidden;background:#fff;
    border-left:1px solid transparent;transition:width .22s ease,border-color .22s}
  #panel.open{width:376px;border-left-color:var(--line)}
  .pin{width:376px;height:100%;overflow-y:auto;padding:26px 26px 40px;position:relative}
  #pClose{position:absolute;top:20px;right:20px;width:26px;height:26px;padding:0;
    border:0;border-radius:6px;background:transparent;color:#A3AFBC;font-size:18px;
    line-height:1;cursor:pointer}
  #pClose:hover{background:#F1F5F9;color:var(--ink)}
  .tkr{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:.4px;
    display:flex;align-items:center;gap:9px}
  .tkr .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .cname{font-size:16.5px;font-weight:600;margin:3px 0 5px;letter-spacing:-.1px}
  .kind{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.2px}
  .loc{font-size:9.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
    color:#B6C1CC;margin-top:15px}
  .rule{height:1px;background:var(--line);margin:17px 0}
  .about{font-size:13px;line-height:1.55;color:#42526A;margin:0}
  .sec{font-size:9.5px;font-weight:700;letter-spacing:1.3px;color:#A3AFBC;margin:0 0 9px}
  .frow{display:flex;gap:7px;align-items:baseline;font-size:12.5px;color:#42526A;
    margin-bottom:7px;line-height:1.35}
  .frow .ar{color:#A9B6C4;flex:0 0 auto}
  .frow .lb{color:#8A99AA;font-size:11px}
  .muted{font-size:12px;color:#A3AFBC;font-style:italic}

  @media (max-width:880px){
    /* narrow: the panel overlays rather than crushing the diagram */
    #panel{position:fixed;top:0;right:0;height:100%;z-index:30;
      box-shadow:-14px 0 30px rgba(15,23,42,.10);transition:transform .22s ease,width 0s}
    #panel{width:340px;transform:translateX(100%)}
    #panel.open{width:340px;transform:translateX(0)}
    .pin{width:340px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><svg id="svg" viewBox="0 0 1660 1000" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="panel" aria-live="polite" aria-label="Company details">
    <div class="pin">
      <button id="pClose" type="button" title="Close (Esc)" aria-label="Close">&times;</button>
      <div class="tkr" id="pTar"></div>
      <div class="cname" id="pName"></div>
      <div class="kind" id="pKind"></div>
      <div class="loc" id="pLoc"></div>
      <div class="rule"></div>
      <p class="about" id="pAbout"></p>
      <div class="rule"></div>
      <div id="pFlows"></div>
    </div>
  </aside>
</div>
<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};

/* ---------- companies ---------- */
const CO={
  XOM:["ExxonMobil","Integrated major","Oil and gas production, refining and chemicals, with a growing low-carbon arm."],
  CVX:["Chevron","Integrated major","Upstream production, refining and fuels retail; large Permian and Kazakhstan positions."],
  COP:["ConocoPhillips","Upstream E&P","Pure upstream producer with no refining; big Permian, Eagle Ford and Alaska acreage."],
  OXY:["Occidental Petroleum","Upstream + chemicals","Oil and gas producer with a dominant Permian position, plus OxyChem petrochemicals."],
  EOG:["EOG Resources","Shale E&P","Shale operator focused on oil and gas in the Permian, Eagle Ford and Bakken."],
  FANG:["Diamondback Energy","Permian E&P","Low-cost Permian pure-play oil producer in the Midland and Delaware basins."],

  BTU:["Peabody Energy","Coal producer","Thermal and metallurgical coal miner with a large seaborne export business."],
  CEIX:["CONSOL Energy","Coal producer","Coal miner supplying US power plants and export thermal coal markets."],
  ARLP:["Alliance Resource Partners","Coal producer","Appalachian and Illinois Basin coal producer with export and royalty interests."],

  CCJ:["Cameco","Uranium mining","Uranium producer with mines in Canada and Kazakhstan, plus fuel services."],
  LEU:["Centrus Energy","Enrichment","Uranium enrichment and nuclear fuel components for US and international reactors."],
  BWXT:["BWX Technologies","Nuclear equipment","Nuclear components, fuel and reactor services for defense and commercial power."],

  FSLR:["First Solar","Solar manufacturing","Thin-film cadmium-telluride solar panel maker; supplies utility-scale projects."],
  ENPH:["Enphase Energy","Solar equipment","Microinverters and home battery systems for residential solar."],
  SEDG:["SolarEdge","Solar equipment","Solar inverters and power optimizers for residential and commercial systems."],
  RUN:["Sunrun","Residential solar","Residential solar installer and financer; also sells home battery storage."],

  DAR:["Darling Ingredients","Biofuel feedstock","Renders animal byproducts into feedstocks for renewable diesel and biodiesel."],
  GPRE:["Green Plains","Ethanol","Ethanol producer and corn processor; also makes protein feed and corn oil."],
  BEP:["Brookfield Renewable","Renewable power","Owns hydro, wind and solar generation; sells power under long-term contracts."],

  ENB:["Enbridge","Pipelines","Pipelines and gas utilities; moves crude oil, liquids and natural gas across North America."],
  KMI:["Kinder Morgan","Pipelines","Natural gas pipelines plus products pipelines, terminals and CO2 infrastructure."],
  WMB:["Williams","Gas infrastructure","Natural gas gathering, processing and interstate transmission, mainly in the US East."],
  OKE:["ONEOK","NGL infrastructure","Natural gas liquids and natural gas pipelines, processing and fractionation."],
  ET:["Energy Transfer","Midstream","Midstream pipelines, storage and processing for natural gas, NGLs and crude."],

  MPC:["Marathon Petroleum","Refining + retail","Refining plus the largest US fuel retail network; also midstream stakes."],
  PSX:["Phillips 66","Refining + chemicals","Refining, midstream and petrochemicals through its CPChem joint venture."],
  PBF:["PBF Energy","Refining","Independent refiner with East and West Coast refineries and logistics."],
  DOW:["Dow Inc.","Petrochemicals","Plastics, industrial intermediates, silicones and coatings."],
  LYB:["LyondellBasell","Petrochemicals","Olefins and polyolefins producer; makes plastics from refinery-derived feedstocks."],

  NEE:["NextEra Energy","Utility + renewables","Largest US regulated utility holding and the world's biggest renewables developer."],
  CEG:["Constellation Energy","Nuclear power","Largest US nuclear operator; sells power to utilities and under corporate PPAs."],
  VST:["Vistra","Independent power","Competitive power producer and retail supplier with a large gas and nuclear fleet."],
  NRG:["NRG Energy","Retail power","Competitive retail electricity and generation for homes and businesses."],
  AES:["AES Corp","Global power","Global power generation, utility-scale renewables and battery storage."],

  FLNC:["Fluence Energy","Storage systems","Grid-scale battery storage systems and energy management software."],
  TSLA:["Tesla","Storage + EVs","Electric vehicles plus energy storage (Megapack) and solar."],
  ALB:["Albemarle","Lithium","Lithium producer for batteries; also bromine specialties and refining catalysts."],
  PLUG:["Plug Power","Hydrogen","Hydrogen fuel cells, electrolyzers and green hydrogen production."],

  DUK:["Duke Energy","Regulated utility","Regulated electric and gas utility serving the Carolinas, Florida and the Midwest."],
  SO:["Southern Company","Regulated utility","Regulated utility holding with electric and gas service across the Southeast."],
  D:["Dominion Energy","Regulated utility","Electric and gas distribution in Virginia and the Carolinas."],
  AEP:["American Electric Power","Regulated utility","Regulated electric utility in 11 states; one of the largest US transmission owners."],
  EXC:["Exelon","Wires-only utility","Transmission and distribution utility (ComEd, PECO, BGE) with no generation."],
  SRE:["Sempra","Utility + LNG","Utility holding (SDG&E, SoCalGas) plus LNG and Mexican energy infrastructure."],
  NI:["NiSource","Regulated utility","Regulated gas and electric distribution across six Midwest states."],
  ATO:["Atmos Energy","Gas distribution","Largest pure-play natural gas distribution utility in the US."],

  SLB:["SLB","Oilfield services","World's largest oilfield services company: drilling, completions and digital."],
  HAL:["Halliburton","Oilfield services","Cementing, stimulation and completions services for oil and gas producers."],
  BKR:["Baker Hughes","Oilfield + equipment","Oilfield equipment and services plus industrial gas turbines and power gear."],
  NOV:["NOV Inc.","Oilfield equipment","Drilling rig equipment and oilfield hardware for onshore and offshore work."],
  GEV:["GE Vernova","Power equipment","Gas turbines, grid equipment and wind turbines — the GE energy spin-off."],
  ETN:["Eaton","Electrical equipment","Electrical grid, power management and data-center equipment."],
  PWR:["Quanta Services","Grid construction","Builds and maintains electric transmission, substations and grid infrastructure."],
  EMR:["Emerson Electric","Automation","Automation and control systems for energy, power and industrial plants."],
  HUBB:["Hubbell","Grid hardware","Electrical grid and utility hardware components."],

  SQM:["SQM","Lithium + chemicals","Lithium, iodine and specialty plant nutrients from Chile's Atacama brine."],
  MP:["MP Materials","Rare earths","Mines and processes rare-earth elements at Mountain Pass; makes magnets."],
  FCX:["Freeport-McMoRan","Copper mining","Copper producer — the metal that wires grids, motors and data centers."],

  MSFT:["Microsoft","Data center buyer","Hyperscale data centers; buys clean power at scale, including nuclear agreements."],
  AMZN:["Amazon","Data center buyer","AWS data centers plus Amazon's own renewable and nuclear power procurement."],
  GOOGL:["Alphabet","Data center buyer","Google data centers; a 24/7 carbon-free energy buyer with advanced nuclear deals."],
  META:["Meta Platforms","Data center buyer","Data centers for AI workloads; a very large PPA buyer now adding nuclear."]
};

const G={fossil:"#C2410C",lowc:"#0E9F6E",infra:"#2563EB",svc:"#64748B",use:"#334155"};
const TINT={fossil:"#FAF0E9",lowc:"#EAF7F1",infra:"#ECF1FD",svc:"#F0F3F6",use:"#EDF0F3"};

const COL_TITLES=["PRIMARY ENERGY","MIDSTREAM & TRANSPORT","CONVERSION & GENERATION","DELIVERY","END USE"];
const CX=[230,530,830,1130,1460];
const NW=[230,230,250,250,230];

const NODES=[
  {id:"oil",   c:0,label:"Oil & Gas",           g:"fossil",cos:["XOM","CVX","COP","OXY","EOG","FANG"]},
  {id:"coal",  c:0,label:"Coal",                g:"fossil",cos:["BTU","CEIX","ARLP"]},
  {id:"uran",  c:0,label:"Uranium & Fuel",      g:"lowc",  cos:["CCJ","LEU","BWXT"]},
  {id:"solar", c:0,label:"Solar & Wind",        g:"lowc",  cos:["FSLR","ENPH","SEDG","RUN"]},
  {id:"bio",   c:0,label:"Bio & Hydro",         g:"lowc",  cos:["DAR","GPRE","BEP"]},

  {id:"pipe",  c:1,label:"Pipelines & Storage", g:"infra", cos:["ENB","KMI","WMB","OKE","ET"]},
  {id:"lng",   c:1,label:"LNG & Export",        g:"infra", cos:["LNG","NFE"]},

  {id:"ref",   c:2,label:"Refining & Fuels",    g:"fossil",cos:["VLO","MPC","PSX","PBF"]},
  {id:"chem",  c:2,label:"Chemicals",           g:"fossil",cos:["DOW","LYB"]},
  {id:"gen",   c:2,label:"Power Generation",    g:"infra", cos:["NEE","CEG","VST","NRG","AES"]},
  {id:"store", c:2,label:"Storage & Hydrogen",  g:"lowc",  cos:["FLNC","TSLA","ALB","PLUG"]},

  {id:"util",  c:3,label:"Electric Utilities",  g:"infra", cos:["DUK","SO","D","AEP","EXC"]},
  {id:"gasut", c:3,label:"Gas Utilities",       g:"infra", cos:["SRE","NI","ATO"]},

  {id:"homes", c:4,label:"Homes & Buildings",   g:"use",   cos:[],tag:"residential"},
  {id:"trans", c:4,label:"Transport",           g:"use",   cos:[],tag:"road · air · marine"},
  {id:"ind",   c:4,label:"Industry",            g:"use",   cos:[],tag:"manufacturing"},
  {id:"dc",    c:4,label:"Data Centers",        g:"use",   cos:["MSFT","AMZN","GOOGL","META"],tag:"hyperscale compute"}
];

/* l = always-on label;  everything else is revealed while a node is traced */
const EDGES=[
  {a:"oil",b:"pipe",l:"crude · gas"},{a:"oil",b:"ref"},{a:"oil",b:"chem"},
  {a:"coal",b:"gen",l:"coal"},{a:"uran",b:"gen",l:"fuel"},
  {a:"solar",b:"gen"},{a:"bio",b:"ref",l:"biofuels"},
  {a:"pipe",b:"ref"},{a:"pipe",b:"lng"},{a:"pipe",b:"gen",l:"gas"},
  {a:"pipe",b:"gasut"},
  {a:"lng",b:"ind"},
  {a:"ref",b:"trans",l:"fuels"},{a:"ref",b:"ind"},
  {a:"chem",b:"ind",l:"plastics"},
  {a:"gen",b:"util"},{a:"gen",b:"dc",l:"PPA"},
  {a:"util",b:"homes"},{a:"util",b:"ind"},{a:"util",b:"dc"},
  {a:"gasut",b:"homes",l:"heat"},{a:"gasut",b:"ind"}
];

const ENABLERS=[
  {id:"e-svc", g:"svc", label:"Oilfield Services",cos:["SLB","HAL","BKR","NOV"]},
  {id:"e-eq",  g:"svc", label:"Power & Grid Equipment",cos:["GEV","ETN","PWR","EMR","HUBB"]},
  {id:"e-mat", g:"svc", label:"Materials & Mining",cos:["SQM","MP","FCX"]}
];

/* ---------- measurement ---------- */
const mctx=document.createElement("canvas").getContext("2d");
mctx.font='600 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace';
const chipW=t=>Math.ceil(mctx.measureText(t).width)+16;

/* ---------- layout ---------- */
const TOP=168, AVAIL=580, CH=20, CGAP=6, RGAP=28;
NODES.forEach(n=>{
  n.x=CX[n.c]; n.w=NW[n.c];
  const inner=n.w-28; let rows=[],cur=[],rw=0;
  n.cos.forEach(t=>{const w=chipW(t);
    if(cur.length&&rw+CGAP+w>inner){rows.push({items:cur,w:rw});cur=[];rw=0;}
    if(cur.length)rw+=CGAP; cur.push({t,w}); rw+=w;});
  if(cur.length)rows.push({items:cur,w:rw});
  n.rows=rows;
  const chipsH=rows.length?rows.length*CH+(rows.length-1)*CGAP:0;
  let h=14+18+(chipsH?8+chipsH:0)+(n.tag?(chipsH?7:7)+14:0)+14;
  n.h=Math.max(h,n.c===4?88:76);
});
const byId={}; NODES.forEach(n=>byId[n.id]=n);
[0,1,2,3,4].forEach(c=>{
  const col=NODES.filter(n=>n.c===c);
  const total=col.reduce((s,n)=>s+n.h,0)+RGAP*(col.length-1);
  let y=TOP+Math.max(0,(AVAIL-total)/2);
  col.forEach(n=>{n.y=y;y+=n.h+RGAP;});
});

const outs={},ins={};
EDGES.forEach((e,i)=>{ (outs[e.a]=outs[e.a]||[]).push(i); (ins[e.b]=ins[e.b]||[]).push(i); });
const spread=(node,i,arr)=>node.y+16+(arr.indexOf(i)+1)*(node.h-32)/(arr.length+1);
EDGES.forEach((e,i)=>{
  const A=byId[e.a],B=byId[e.b];
  e.x1=A.x+A.w/2; e.y1=spread(A,i,outs[e.a]);
  e.x2=B.x-B.w/2; e.y2=spread(B,i,ins[e.b]);
});

/* ---------- render ---------- */
const svg=document.getElementById("svg");
const defs=el("defs",{},svg);
function marker(id,color){
  const m=el("marker",{id:id,viewBox:"0 0 8 8",refX:"6.6",refY:"4",markerWidth:"8",
    markerHeight:"8",orient:"auto",markerUnits:"strokeWidth"},defs);
  el("path",{d:"M0.5,1 L7,4 L0.5,7 z",fill:color},m);
}
marker("m-flow","#A9B6C4"); marker("m-svc","#B7C1CD"); marker("m-cap","#DDBBA4");

const gEdge=el("g",{},svg);
const gBand=el("g",{},svg);
const gNode=el("g",{},svg);

EDGES.forEach(e=>{
  const dx=e.x2-e.x1, c=Math.max(28,dx*0.52);
  const p=el("path",{d:`M${e.x1},${e.y1} C${e.x1+c},${e.y1} ${e.x2-c},${e.y2} ${e.x2},${e.y2}`,
    class:"edge","marker-end":"url(#m-flow)","data-a":e.a,"data-b":e.b},gEdge);
  e.el=p;
  const t=el("text",{x:e.x1+7,y:e.y1-5,class:"edge-lbl"+(e.l?" static":"")},gEdge);
  t.textContent=e.l||"";
  e.lbl=t;
});

/* ---------- enabler guide + band ---------- */
const GUIDE_Y=752, bandTop=796, bandX0=290, bandX1=1290, bandCx=(bandX0+bandX1)/2;
el("path",{d:`M${CX[0]},${GUIDE_Y} L${CX[3]},${GUIDE_Y}`,class:"edge svc",
  "marker-end":"url(#m-svc)"},gBand);
[0,1,2,3].forEach(c=>{
  const n=NODES.filter(m=>m.c===c).slice(-1)[0];
  el("path",{d:`M${CX[c]},${GUIDE_Y} L${CX[c]},${n.y+n.h+3}`,class:"edge svc",
    "marker-end":"url(#m-svc)"},gBand);
});
el("path",{d:`M${bandCx},${bandTop} L${bandCx},${GUIDE_Y+3}`,class:"edge svc",
  "marker-end":"url(#m-svc)"},gBand);
const gl=el("text",{x:CX[0]+10,y:GUIDE_Y-9,class:"edge-lbl static"},gBand);
gl.textContent="supplies every stage";

const cap=el("text",{x:bandX0,y:bandTop-14,class:"col-title"},gBand);
cap.textContent="ENABLERS";
const BW=322, BGAP=16, BH=74;
ENABLERS.forEach((g,i)=>{
  const x=bandX0+i*(BW+BGAP);
  el("rect",{x:x,y:bandTop,width:BW,height:BH,rx:10,class:"band-box"},gBand);
  const lt=el("text",{x:x+14,y:bandTop+22,class:"band-lbl"},gBand); lt.textContent=g.label;
  let cx=x+14, cy=bandTop+34;
  g.cos.forEach(t=>{
    const w=chipW(t);
    const cg=el("g",{class:"chip",tabindex:"0",role:"button"},gBand);
    cg.setAttribute("aria-label",t+" — "+CO[t][0]);
    el("rect",{x:cx,y:cy,width:w,height:CH,rx:5,class:"chip-box"},cg);
    const tx=el("text",{x:cx+w/2,y:cy+CH/2+3.7,class:"chip-text","text-anchor":"middle"},cg);
    tx.textContent=t;
    bindChip(cg,t,g.id);
    cx+=w+CGAP;
  });
});

/* ---------- capital loop ---------- */
function roundPath(pts,r){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    const v1=[p1[0]-p0[0],p1[1]-p0[1]],v2=[p2[0]-p1[0],p2[1]-p1[1]];
    const l1=Math.hypot(v1[0],v1[1]),l2=Math.hypot(v2[0],v2[1]);
    const rr=Math.min(r,l1/2,l2/2);
    const a=[p1[0]-v1[0]/l1*rr,p1[1]-v1[1]/l1*rr];
    const b=[p1[0]+v2[0]/l2*rr,p1[1]+v2[1]/l2*rr];
    d+=` L${a[0]},${a[1]} Q${p1[0]},${p1[1]} ${b[0]},${b[1]}`;
  }
  const L=pts[pts.length-1]; return d+` L${L[0]},${L[1]}`;
}
const dcN=byId["dc"], oilN=byId["oil"], LOOP_Y=936;
const loop=[[CX[4],dcN.y+dcN.h+2],[CX[4],LOOP_Y],[60,LOOP_Y],
            [60,oilN.y+oilN.h/2],[CX[0]-oilN.w/2-2,oilN.y+oilN.h/2]];
el("path",{d:roundPath(loop,18),class:"edge cap","marker-end":"url(#m-cap)"},gEdge);
const capLbl=el("text",{x:60,y:LOOP_Y-12,class:"cap-lbl"},gEdge);
capLbl.textContent="REVENUE & CAPITAL RETURNS";

/* ---------- nodes ---------- */
NODES.forEach(n=>{
  const g=el("g",{class:"g-node","data-id":n.id},gNode); n.gEl=g;
  el("rect",{x:n.x-n.w/2,y:n.y,width:n.w,height:n.h,rx:12,class:"node-box"},g);
  const cy=n.y+26;
  el("circle",{cx:n.x-n.w/2+18,cy:cy-4,r:3.6,fill:G[n.g]},g);
  const lt=el("text",{x:n.x-n.w/2+30,y:cy,class:"node-label"},g);
  lt.textContent=n.label;
  let yy=n.y+42;
  if(n.rows.length){
    yy+=8;
    n.rows.forEach(row=>{
      let cx=n.x-row.w/2;
      row.items.forEach(it=>{
        const cg=el("g",{class:"chip",tabindex:"0",role:"button"},g);
        cg.setAttribute("aria-label",it.t+" — "+CO[it.t][0]);
        el("rect",{x:cx,y:yy,width:it.w,height:CH,rx:5,class:"chip-box"},cg);
        const tx=el("text",{x:cx+it.w/2,y:yy+CH/2+3.7,class:"chip-text","text-anchor":"middle"},cg);
        tx.textContent=it.t;
        bindChip(cg,it.t,n.id);
        cx+=it.w+CGAP;
      });
      yy+=CH+CGAP;
    });
    yy-=CGAP;
  }
  if(n.tag){ yy+=7; const tg=el("text",{x:n.x,y:yy+12,class:"node-tag","text-anchor":"middle"},g);
    tg.textContent=n.tag; }
  g.addEventListener("mouseenter",()=>focus(n.id));
  g.addEventListener("mouseleave",()=>{
    /* keep a clicked company's own trace pinned while the user moves around */
    if(picked&&picked.nodeId&&byId[picked.nodeId]) focus(picked.nodeId); else blur();
  });
});

/* ---------- trace on hover ---------- */
function focus(id){
  const near={}; near[id]=1;
  EDGES.forEach(e=>{ if(e.a===id)near[e.b]=1; if(e.b===id)near[e.a]=1; });
  EDGES.forEach(e=>{
    const on=(e.a===id||e.b===id);
    e.el.classList.toggle("hl",on); e.el.classList.toggle("dim",!on);
    e.lbl.classList.toggle("on",on); e.lbl.classList.toggle("fade",!on);
  });
  NODES.forEach(n=>n.gEl.classList.toggle("dim",!near[n.id]));
}
function blur(){
  EDGES.forEach(e=>{e.el.classList.remove("hl","dim");
    e.lbl.classList.remove("on","fade");});
  NODES.forEach(n=>n.gEl.classList.remove("dim"));
}

/* ---------- hover tooltip ---------- */
const tip=document.createElement("div");
tip.id="tip";
tip.style.cssText="position:fixed;pointer-events:none;background:#0F172A;color:#fff;font-size:11.5px;"+
  "font-weight:500;line-height:1.25;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .12s;"+
  "white-space:nowrap;z-index:40;transform:translate(12px,12px)";
document.body.appendChild(tip);

/* ---------- chips: hover tip + click → panel ---------- */
let picked=null;
function bindChip(nodeEl,tk,nodeId){
  const g=byId[nodeId]?byId[nodeId].g:(ENABLERS.find(e=>e.id===nodeId)||{}).g||"svc";
  nodeEl.style.setProperty("--c",G[g]);
  nodeEl.style.setProperty("--t",TINT[g]);
  nodeEl.addEventListener("mouseenter",()=>{
    const nm=CO[tk][0];
    tip.innerHTML=`<span style="font-family:var(--mono);font-weight:700;color:#BFD3EA">${tk}</span>`+
      (nm===tk?"":`&nbsp;&nbsp;${nm}`);
    tip.style.opacity="1";
  });
  nodeEl.addEventListener("mousemove",ev=>{tip.style.left=ev.clientX+"px";tip.style.top=ev.clientY+"px";});
  nodeEl.addEventListener("mouseleave",()=>{tip.style.opacity="0";});
  nodeEl.addEventListener("click",ev=>{ev.stopPropagation();pick(tk,nodeId,nodeEl);});
  nodeEl.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick(tk,nodeId,nodeEl);}
  });
}

/* ---------- company panel ---------- */
const panel=document.getElementById("panel");
const $=id=>document.getElementById(id);
document.getElementById("pClose").onclick=()=>closePanel();
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closePanel(); });
svg.addEventListener("click",()=>closePanel());   // a click on empty canvas clears it

function pick(tk,nodeId,chipEl){
  const [name,kind,about]=CO[tk];
  const node=byId[nodeId]||null;
  const gcol=node?G[node.g]:G.svc;
  picked={tk:tk,nodeId:nodeId};

  $("pTar").innerHTML=`<span class="dot" style="background:${gcol}"></span>${tk}`;
  const nmEl=$("pName");
  nmEl.textContent=(name===tk?"":name);
  nmEl.style.display=(name===tk?"none":"");
  $("pKind").textContent=kind;
  $("pLoc").textContent=node
    ? `0${node.c+1} ${COL_TITLES[node.c]} · ${node.label}`
    : `ENABLERS · ${(ENABLERS.find(e=>e.id===nodeId)||{}).label||""}`;
  $("pAbout").textContent=about;

  const flow=$("pFlows"); flow.innerHTML="";
  if(node){
    const out=EDGES.filter(e=>e.a===node.id), inn=EDGES.filter(e=>e.b===node.id);
    if(out.length){
      flow.appendChild(sect("SUPPLIES TO"));
      out.forEach(e=>flow.appendChild(row("→",byId[e.b].label,e.l)));
    }
    if(inn.length){
      flow.appendChild(sect("RECEIVES FROM"));
      inn.forEach(e=>flow.appendChild(row("←",byId[e.a].label,e.l)));
    }
    if(!out.length&&!inn.length) flow.appendChild(muted("A terminal stage — no outgoing flows."));
  }else{
    flow.appendChild(sect("SUPPLIES"));
    flow.appendChild(row("→","Every stage of the chain","services · equipment · materials"));
  }

  document.querySelectorAll(".chip.sel").forEach(c=>c.classList.remove("sel"));
  chipEl.classList.add("sel");
  if(node) focus(node.id); else blur();
  panel.classList.add("open");
}
function sect(t){const d=document.createElement("div");d.className="sec";d.textContent=t;return d;}
function row(ar,label,note){
  const d=document.createElement("div");d.className="frow";
  const a=document.createElement("span");a.className="ar";a.textContent=ar;
  const s=document.createElement("span");
  s.textContent=label+(note?" ":"");
  if(note){const n=document.createElement("span");n.className="lb";n.textContent=" · "+note;s.appendChild(n);}
  d.append(a,s);return d;
}
function muted(t){const d=document.createElement("div");d.className="muted";d.textContent=t;return d;}
function closePanel(){
  picked=null;
  panel.classList.remove("open");
  document.querySelectorAll(".chip.sel").forEach(c=>c.classList.remove("sel"));
  blur();
}

/* ---------- column headers ---------- */
[0,1,2,3,4].forEach(c=>{
  const first=NODES.filter(n=>n.c===c)[0];
  const x=CX[c]-NW[c]/2, y=first.y-13;
  const num=el("text",{x:x,y:y,class:"col-title",style:"fill:#C3CCD6"},svg);
  num.textContent="0"+(c+1);
  const t=el("text",{x:x+22,y:y,class:"col-title"},svg);
  t.textContent=COL_TITLES[c];
});

/* ---------- header / footer / legend ---------- */
const h1=el("text",{x:60,y:92,style:"font-size:25px;font-weight:700;letter-spacing:-.3px;fill:#0F172A"},svg);
h1.textContent="The Energy Value Chain";
const h2=el("text",{x:60,y:118,style:"font-size:12.5px;font-weight:500;fill:#5B6B7C"},svg);
h2.textContent="Public companies by sector. Hover to trace a node; click any ticker for the company.";

const legend=[["Hydrocarbons",G.fossil],["Low-carbon",G.lowc],["Infrastructure",G.infra],["Services",G.svc],["End use",G.use]];
let lx=1620;
legend.slice().reverse().forEach(([t,col])=>{
  const tw=t.length*6.1;
  const tx=el("text",{x:lx,y:92,"text-anchor":"end",class:"legend-t"},svg); tx.textContent=t;
  el("circle",{cx:lx-tw-14,cy:88.5,r:3.6,fill:col},svg);
  lx-=tw+52;
});
const lg1=el("text",{x:1620,y:118,"text-anchor":"end",
  style:"font-size:10px;font-weight:500;fill:#93A2B3"},svg);
lg1.textContent="—— energy flow     ╌╌ supplies & capital";

const f=el("text",{x:60,y:986,class:"foot"},svg);
f.textContent="Illustrative. Tickers are examples of public listings; flows and ownership are simplified. Not investment advice.";
})();
</script>

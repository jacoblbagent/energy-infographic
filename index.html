<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Energy Value Chain — Public Companies</title>
<style>
  :root{
    --bg:#FBFBFA;--ink:#0F172A;--muted:#5B6B7C;--faint:#93A2B3;
    --line:#DFE5EC;--node:#FFFFFF;--chip:#F7F9FB;--chipb:#E6EBF1;
    --fossil:#C2410C;--lowc:#0E9F6E;--infra:#2563EB;--svc:#64748B;--use:#334155;
    /* surface/text tokens — every rule below reads one of these, so a theme is
       a token swap and not a second stylesheet. Values are light; the dark
       block at the foot of this <style> overrides the whole set. */
    --body:#42526A;--strong:#334155;--sub:#8A99AA;--faint2:#A3AFBC;--faint3:#B6C1CC;
    --faint4:#C3CCD6;--dim:#7B8A9B;--dim2:#6B7A8C;
    --panel:#FFFFFF;--raised:#FFFFFF;--soft:#F1F4F8;--hover:#F5F8FB;--sel:#E8F0FA;
    --selink:#D9E6F6;--chipHov:#EDF2F7;--chipHovB:#B9C6D4;--band:#FCFDFE;--input:#FBFCFD;
    --inputb:#C3CEDB;--track:#EDF1F6;--bar:#A7B9CB;--hair:#F0F3F7;--rule:#D8E0E8;
    --link:#1F3A5F;--edge:#A9B6C4;--edgeSvc:#B7C1CD;--edgeCap:#DDBBA4;--capLbl:#B57A4E;
    --pin:#AEBBC8;--up:#0E9F6E;--dn:#C2410C;
    --shadow:0 1px 2px rgba(15,23,42,.09);
    --shadow-lg:-14px 0 30px rgba(15,23,42,.10);
    --shadow-sm:-6px 0 16px rgba(15,23,42,.08);
    color-scheme:light;

    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }

  /* value-chain switcher: one tab per chain the diagram can draw ("All" is the
     full energy chain, "AI" is the compute/AI chain). */
  #topbar{flex:0 0 auto;display:flex;align-items:center;gap:11px;
    padding:10px 15px;border-bottom:1px solid var(--line);background:var(--panel)}
  .vtabs{display:flex;gap:2px;background:var(--soft);border-radius:7px;padding:2px}
  .vtab{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;
    color:var(--muted);padding:6px 16px;border-radius:5px;cursor:pointer;letter-spacing:.2px}
  .vtab:hover{color:var(--ink)}
  .vtab.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
  .vtab:focus{outline:none}
  .vtab:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .vwho{font-size:11px;font-weight:500;color:var(--faint)}

  /* stage (diagram) + panel side by side; the panel is a real column, so the
     diagram reflows instead of being covered. */
  #app{flex:1;min-height:0;display:flex;overflow:hidden}
  #stage{flex:1;min-width:0;overflow:auto;display:flex;align-items:center;justify-content:center}
  svg{display:block;width:100%;min-width:900px;height:auto}

  .col-title{font-size:10px;font-weight:700;letter-spacing:1.5px;fill:var(--faint)}
  .node-box{fill:var(--node);stroke:var(--line);stroke-width:1}
  .node-label{font-size:12.5px;font-weight:600;fill:var(--ink)}

  .chip-box{fill:var(--chip);stroke:var(--chipb);stroke-width:1;transition:fill .16s,stroke .16s}
  .chip-text{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--body);
    letter-spacing:.2px;pointer-events:none}
  .chip{cursor:pointer}
  .chip:hover .chip-box{fill:var(--chipHov);stroke:var(--chipHovB)}
  .chip:hover .chip-text{fill:var(--ink)}
  .chip.sel .chip-box{fill:var(--t);stroke:var(--c);stroke-width:1.4}
  .chip.sel .chip-text{fill:var(--c)}
  .chip:focus{outline:none}
  .chip:focus-visible .chip-box{stroke:var(--ink);stroke-width:1.4}

  .g-node{transition:opacity .18s,stroke .18s}
  .g-node.dim{opacity:.2}
  .g-node.pin .node-box{stroke:var(--pin);stroke-width:1.4}

  .edge{fill:none;stroke:var(--edge);stroke-width:1;transition:opacity .18s,stroke .18s,stroke-width .18s}
  .edge.dim{opacity:.07}
  .edge.hl{opacity:1;stroke-width:1.7;stroke:var(--strong)}
  .edge-lbl{font-size:9px;font-weight:600;fill:var(--dim);letter-spacing:.1px;opacity:0;
    transition:opacity .18s;paint-order:stroke;stroke:var(--bg);stroke-width:3;stroke-linejoin:round}
  .edge-lbl.on{opacity:1}
  .edge-lbl.static{opacity:1}
  .edge-lbl.fade{opacity:.13}

  .svc{stroke:var(--edgeSvc);stroke-dasharray:3 4}
  .cap{stroke:var(--edgeCap);stroke-dasharray:4 5}
  .cap-lbl{font-size:9px;font-weight:700;fill:var(--capLbl);letter-spacing:.6px}

  .band-box{fill:var(--band);stroke:var(--chipb);stroke-width:1;stroke-dasharray:3 4}
  .band-lbl{font-size:10.5px;font-weight:700;fill:var(--muted);letter-spacing:.6px}
  .foot{font-size:9.5px;fill:var(--faint2)}
  .legend-t{font-size:10px;font-weight:600;fill:var(--muted);letter-spacing:.2px}

  /* ---- company panel ---- */
  #panel{flex:0 0 auto;width:0;overflow:hidden;background:var(--panel);
    border-left:1px solid transparent;transition:width .22s ease,border-color .22s}
  #panel.open{width:400px;border-left-color:var(--line)}
  .pin{width:400px;height:100%;overflow-y:auto;padding:26px 26px 40px;position:relative}
  #pClose{position:absolute;top:20px;right:20px;width:26px;height:26px;padding:0;
    border:0;border-radius:6px;background:transparent;color:var(--faint2);font-size:18px;
    line-height:1;cursor:pointer}
  #pClose:hover{background:var(--hover);color:var(--ink)}
  .tkr{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:.4px;
    display:flex;align-items:center;gap:9px}
  .tkr .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .cname{font-size:16.5px;font-weight:600;margin:3px 0 5px;letter-spacing:-.1px}
  .sect{margin-top:19px;padding-top:15px;border-top:1px solid var(--line)}
  .sect[hidden]{display:none}
  .sl{font-size:9.5px;font-weight:700;letter-spacing:1.3px;color:var(--faint2);
    text-transform:uppercase;margin:0 0 10px}
  .disc>summary{cursor:pointer;list-style:none;display:flex;align-items:center;
    margin:0;user-select:none}
  .disc>summary::-webkit-details-marker{display:none}
  .disc>summary:hover{color:var(--dim2)}
  .disc>summary::after{content:"+";margin-left:auto;font-size:13px;font-weight:700;
    letter-spacing:0;color:var(--faint3)}
  .disc[open]>summary::after{content:"\2013"}
  .disc>div{margin-top:10px}
  .about{font-size:12.5px;line-height:1.55;color:var(--body);margin:0}
  .frow{display:flex;gap:7px;align-items:baseline;font-size:12.5px;color:var(--body);
    margin-bottom:7px;line-height:1.35}
  .frow .ar{color:var(--edge);flex:0 0 auto}
  .frow .lb{color:var(--sub);font-size:11px}
  .muted{font-size:12px;color:var(--faint2);font-style:italic}
  /* ---- direct competitors ---- */
  .sc{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--faint4);
    letter-spacing:0;margin-left:5px}
  .pbasis{font-size:10.5px;color:var(--sub);margin:0 0 8px}
  .prow{display:grid;grid-template-columns:44px 1fr;column-gap:8px;row-gap:2px;
    align-items:baseline;width:100%;padding:5px 6px;border:0;border-radius:6px;
    background:none;font:inherit;text-align:left;cursor:pointer}
  .prow:hover{background:var(--hover)}
  .prow .ptk{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--strong);
    letter-spacing:.2px}
  .prow .pn{font-size:12px;color:var(--body);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .prow .pw{grid-column:2;font-size:10.5px;color:var(--faint2)}
  .prow.off{cursor:default}
  .prow.off:hover{background:none}
  .prow.off .ptk,.prow.off .pn{color:var(--sub)}
  .prow .ptk.dim{color:var(--faint4)}
  .pfoot{font-size:10px;color:var(--faint3);line-height:1.5;margin-top:9px}
  .fact{display:grid;grid-template-columns:82px 1fr;gap:8px;margin-bottom:7px;
    font-size:12.5px;line-height:1.35}
  .fact .k{font-size:9.5px;font-weight:700;letter-spacing:.6px;color:var(--faint2);
    text-transform:uppercase;padding-top:2px}
  .fact .v{color:var(--strong)}
  .fact .yr{color:var(--faint2);font-size:11px}
  /* ---- financials: grouped metric rows, label left, mono value right ---- */
  .fg+.fg{margin-top:13px}
  .fgh{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--edge);
    text-transform:uppercase;margin:0 0 7px}
  .frow2{display:grid;grid-template-columns:126px 1fr;gap:9px;
    font-size:11.5px;line-height:1.4;margin-bottom:6px}
  .frow2 .k{color:var(--sub)}
  .frow2 .v{font-family:var(--mono);font-size:11px;color:var(--strong);letter-spacing:-.1px}
  .frow2 .v .n{font-family:inherit;color:var(--faint2);margin-left:5px}
  .fnote{font-size:9.5px;color:var(--faint3);line-height:1.55;margin-top:12px}
  .nit{margin-bottom:13px}
  .nit:last-child{margin-bottom:4px}
  .nit a{font-size:12.5px;line-height:1.4;color:var(--link);text-decoration:underline;
    text-decoration-color:var(--rule);text-underline-offset:2px;font-weight:500}
  .nit a:hover{color:var(--ink);text-decoration-color:var(--ink)}
  .meta{font-size:10.5px;color:var(--faint2);margin-top:3px}
  .lnks{display:flex;flex-wrap:wrap;gap:6px 14px}
  .lnk{font-size:12px;color:var(--body);text-decoration:none;border-bottom:1px solid var(--rule);
    padding-bottom:1px}
  .lnk:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .asof{font-size:9.5px;color:var(--faint3);margin-top:20px;line-height:1.5}

  /* ---- market rail: top-volume feed + merged ticker news ---- */
  #rail{flex:0 0 auto;width:320px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
    transition:width .22s ease,border-color .22s}
  /* collapsed: the rail stays put as a slim strip with its toggle pinned at the
     top, so the way back is always in the same place */
  body.railoff #rail{width:44px}
  body.railoff .tabs,body.railoff .railbody{display:none}
  body.railoff .railhead{width:44px;justify-content:center;padding:13px 0 11px;
    border-bottom-color:transparent}
  body.railoff #railToggle{color:var(--dim)}
  .railhead{display:flex;align-items:center;gap:8px;flex:0 0 auto;
    padding:13px 12px 11px;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:2px;flex:1;background:var(--soft);border-radius:7px;padding:2px}
  .tab{flex:1;border:0;background:transparent;font:inherit;font-size:11.5px;font-weight:600;
    color:var(--muted);padding:5px 8px;border-radius:5px;cursor:pointer;letter-spacing:.1px}
  .tab.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
  #railToggle{flex:0 0 auto;width:24px;height:24px;padding:0;border:0;border-radius:6px;
    background:transparent;color:var(--faint2);font-size:16px;line-height:1;cursor:pointer}
  #railToggle:hover{background:var(--hover);color:var(--ink)}
  .railbody{flex:1;min-height:0;overflow-y:auto;padding:11px 12px 34px}
  .railnote{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
    color:var(--faint3);margin:1px 2px 8px}

  .vrow{display:grid;grid-template-columns:18px 46px 1fr;column-gap:8px;row-gap:3px;
    align-items:center;width:100%;padding:6px;border:0;border-radius:6px;background:none;
    font:inherit;text-align:left;cursor:pointer}
  .vrow:hover{background:var(--hover)}
  .vrow.sel,.vrow.sel:hover{background:var(--sel)}
  .vrk{font-family:var(--mono);font-size:10px;color:var(--faint3);text-align:right}
  .vtk{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--strong);letter-spacing:.2px}
  .vnm{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vfoot{grid-column:2 / 4;display:flex;align-items:center;gap:8px}
  .vbar{flex:1;min-width:24px;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
  .vbar i{display:block;height:100%;background:var(--bar);border-radius:2px}
  .vvol{font-family:var(--mono);font-size:10px;color:var(--dim)}
  .vchg{font-family:var(--mono);font-size:10px;font-weight:600}
  .up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--faint)}

  .newsbar{display:flex;gap:6px;margin-bottom:6px}
  #newsQ{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 8px;
    font:inherit;font-size:11.5px;color:var(--ink);background:var(--input)}
  #newsQ:focus{outline:none;border-color:var(--inputb);background:var(--panel)}
  .sorts{display:flex;background:var(--soft);border-radius:6px;padding:2px}
  .sort{border:0;background:none;font:inherit;font-size:10.5px;font-weight:600;color:var(--muted);
    padding:4px 7px;border-radius:4px;cursor:pointer}
  .sort.on{background:var(--raised);color:var(--ink)}
  .nrow{padding:9px 4px;border-bottom:1px solid var(--hair)}
  .nrow:last-child{border-bottom:0}
  .nt{display:block;font-size:12px;line-height:1.4;font-weight:500;color:var(--link);
    text-decoration:none}
  .nt:hover{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);
    text-underline-offset:2px}
  .nmeta{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:10px;color:var(--faint2)}
  .ntk{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.2px;
    padding:1px 5px;border:0;border-radius:4px;background:var(--soft);color:var(--body);cursor:pointer}
  .ntk:hover{background:var(--chipb);color:var(--ink)}
  .ntk.sel,.ntk.sel:hover{background:var(--selink);color:var(--ink)}
  .nmore,.nempty{display:block;width:100%;margin-top:10px;padding:7px;border:1px solid var(--line);
    background:var(--panel);border-radius:6px;font:inherit;font-size:11px;font-weight:600;
    color:var(--body);cursor:pointer;text-align:center}
  .nmore:hover{background:var(--hover)}
  .nempty{border:0;color:var(--faint2);font-weight:500;cursor:default}

  @media (max-width:1180px){
    /* narrow: a tighter label column keeps each metric on one line */
    .frow2{grid-template-columns:112px 1fr}
    /* narrow: the panel and the rail overlay rather than crushing the diagram */
    #panel{position:fixed;top:0;right:0;height:100%;z-index:35;
      box-shadow:var(--shadow-lg);transition:transform .22s ease,width 0s}
    #panel{width:340px;transform:translateX(100%)}
    #panel.open{width:340px;transform:translateX(0)}
    .pin{width:340px}

    #rail{position:fixed;top:0;right:0;height:100%;z-index:30;width:330px;
      box-shadow:var(--shadow-lg);transform:translateX(0);
      transition:transform .22s ease}
    body.railoff #rail{width:330px;transform:translateX(calc(100% - 44px));
      box-shadow:var(--shadow-sm)}
  }

  /* ---- dark theme -------------------------------------------------------
     Only tokens change. The diagram's group palettes and its marker/arrowhead
     colors are generated in JS, so setTheme() swaps PAL and redraws the view
     at the same time this runs. */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0B1017;--ink:#E7EDF5;--muted:#97A6B6;--faint:#74838F;
    --line:#232F3C;--node:#121A24;--chip:#18222F;--chipb:#2A3644;
    --body:#B6C3D2;--strong:#CBD6E2;--sub:#8B9AAB;--faint2:#6F7E8E;--faint3:#5F6E7E;
    --faint4:#4E5C6B;--dim:#8394A4;--dim2:#9AAAB9;
    --panel:#101822;--raised:#24313F;--soft:#1A2430;--hover:#17212D;--sel:#1B2B3C;
    --selink:#22384F;--chipHov:#1E2A38;--chipHovB:#3A4A5C;--band:#0F1620;
    --input:#131C27;--inputb:#3A4A5C;--track:#1E2A38;--bar:#4C6376;--hair:#1A2430;
    --rule:#2C3A48;--link:#8FB8E8;--edge:#4A5A6B;--edgeSvc:#47576A;--edgeCap:#8A6A4E;
    --capLbl:#C9905F;--pin:#5C6E80;--up:#34D399;--dn:#F97316;
    --shadow:0 1px 2px rgba(0,0,0,.45);
    --shadow-lg:-14px 0 30px rgba(0,0,0,.55);
    --shadow-sm:-6px 0 16px rgba(0,0,0,.45);
  }
  /* theme switch: a glyph button at the far right of the view tabs */
  .ttog{margin-left:auto;width:26px;height:26px;padding:0;border:0;border-radius:6px;
    background:transparent;color:var(--muted);font-size:13px;line-height:1;cursor:pointer}
  .ttog:hover{background:var(--hover);color:var(--ink)}
  .ttog:focus{outline:none}
  .ttog:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  @media (max-width:1180px){
    /* the rail is fixed over the right edge, topbar included, so the theme
       switch joins the left cluster instead of sitting under the rail head */
    .ttog{margin-left:0}
  }
</style>
<script>
/* theme before first paint: the stored choice, else the OS preference */
(function(){
  var t=null;
  try{ t=localStorage.getItem("evc-theme"); }catch(e){}
  if(t!=="light"&&t!=="dark")
    t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;
})();
</script>
</head><body>
<div id="topbar">
  <div class="vtabs" role="tablist" aria-label="Value chain">
    <button class="vtab on" type="button" role="tab" aria-selected="true"
      data-view="energy">All</button>
    <button class="vtab" type="button" role="tab" aria-selected="false"
      data-view="ai">AI</button>
    <button class="vtab" type="button" role="tab" aria-selected="false"
      data-view="dc">Data center</button>
  </div>
  <div class="vwho" id="vWho"></div>
  <!-- theme switch: dark is a token swap on <html data-theme>, set before paint
       by the inline head script so a reload never flashes the light palette -->
  <button class="ttog" id="themeToggle" type="button" aria-pressed="false"
    aria-label="Switch to dark theme" title="Switch to dark theme">&#9790;</button>
</div>
<div id="app">
  <div id="stage"><svg id="svg" viewBox="0 0 1660 1000" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="panel" aria-live="polite" aria-label="Company details">
    <div class="pin">
      <button id="pClose" type="button" title="Close (Esc)" aria-label="Close">&times;</button>
      <div class="tkr" id="pTar"></div>
      <div class="cname" id="pName"></div>
      <div class="sect">
        <div class="sl">About</div>
        <p class="about" id="pAbout"></p>
      </div>

      <details class="sect disc" id="secFacts">
        <summary class="sl">Company</summary>
        <div id="pFacts"></div>
      </details>

      <details class="sect disc" id="secFlows">
        <summary class="sl">Flows</summary>
        <div id="pFlows"></div>
      </details>

      <details class="sect disc" id="secFin">
        <summary class="sl">Financials</summary>
        <div id="pFin"></div>
      </details>

      <details class="sect disc" id="secPeers">
        <summary class="sl">Direct competitors <span class="sc" id="pPeerN"></span></summary>
        <div id="pPeers"></div>
      </details>

      <div class="sect">
        <div class="sl">Recent news</div>
        <div id="pNews"></div>
      </div>

      <div class="sect" id="secLinks">
        <div id="pLinks"></div>
      </div>

      <div class="asof" id="pAsof"></div>
    </div>
  </aside>

  <!-- market rail: a persistent right-hand section with two tabs — the live
       volume leaderboard and a merged, prioritised news feed over every ticker
       the diagram lists. Rows open the same company panel a chip click does. -->
  <aside id="rail" aria-label="Market feed">
    <div class="railhead">
      <div class="tabs" role="tablist">
        <button class="tab on" type="button" role="tab" aria-selected="true"
          data-tab="vol">Volume</button>
        <button class="tab" type="button" role="tab" aria-selected="false"
          data-tab="news">News</button>
      </div>
      <button id="railToggle" type="button" title="Hide the feed">&rsaquo;</button>
    </div>
    <div class="railbody">
      <div id="volPane" role="tabpanel">
        <div class="railnote" id="volAsOf"></div>
        <div id="volList"></div>
      </div>
      <div id="newsPane" role="tabpanel" hidden>
        <div class="newsbar">
          <input id="newsQ" type="search" placeholder="Filter ticker or name"
            aria-label="Filter headlines by ticker or company name">
          <div class="sorts" role="group" aria-label="Sort order">
            <button class="sort on" type="button" data-sort="pri">Priority</button>
            <button class="sort" type="button" data-sort="new">Newest</button>
          </div>
        </div>
        <div id="newsList"></div>
      </div>
    </div>
  </aside>
</div>
<script>

const CO={
  XOM:["ExxonMobil","Integrated major","ExxonMobil spans the whole chain: it drills for oil and gas, refines crude into fuels, and runs a large chemicals business. Its low-carbon arm covers carbon capture, hydrogen and biofuels, and it holds major acreage in the Permian and Guyana."],
  CVX:["Chevron","Integrated major","Chevron explores for and produces oil and gas upstream, refines it into fuels and lubricants, and sells through retail stations. Its portfolio leans on the Permian basin, Kazakhstan and a growing low-carbon unit."],
  COP:["ConocoPhillips","Upstream E&P","ConocoPhillips is a pure upstream producer — it finds and pumps oil and gas and sells the raw barrels, with no refining or retail. Its scale comes from Permian, Eagle Ford, Bakken and Alaska acreage, plus LNG interests abroad."],
  OXY:["Occidental Petroleum","Upstream + chemicals","Occidental is an oil and gas producer with a dominant Permian position and stakes in the Middle East, plus the OxyChem petrochemicals business. It is also a leading player in carbon capture, using CO2 to boost oil recovery."],
  EOG:["EOG Resources","Shale E&P","EOG is a shale specialist that drills horizontal wells for oil and gas in the Permian, Eagle Ford, Bakken and other US basins. It sells unrefined crude, natural gas and gas liquids to midstream buyers."],
  FANG:["Diamondback Energy","Permian E&P","Diamondback is a low-cost pure-play oil producer concentrated in the Permian basin's Midland and Delaware formations. It sells crude, natural gas and gas liquids, and has expanded through acquisitions of Permian peers."],

  BTU:["Peabody Energy","Coal producer","Peabody mines thermal coal for power generation and metallurgical coal for steelmaking, with a large seaborne export business. It ships coal from US and Australian mines to buyers in Asia, Europe and the Americas."],
  CEIX:["CONSOL Energy","Coal producer","CONSOL Energy mines coal from the Appalachian and Illinois basins, supplying US power plants and export thermal markets. It also markets coal and owns a marine terminal that loads vessels for export."],
  ARLP:["Alliance Resource Partners","Coal producer","Alliance Resource Partners is a coal producer with mines in the Appalachian and Illinois basins, plus export and royalty interests. It sells thermal coal to US utilities and international buyers."],

  CCJ:["Cameco","Uranium mining","Cameco mines and mills uranium in Canada and Kazakhstan and provides fuel services such as refining and conversion. Its uranium feeds nuclear reactors that generate carbon-free baseload electricity."],
  LEU:["Centrus Energy","Enrichment","Centrus Energy supplies enriched uranium and technical services for commercial reactors in the US and abroad. It is also developing US-based enrichment capability to reduce reliance on foreign supply."],
  BWXT:["BWX Technologies","Nuclear equipment","BWX Technologies makes nuclear components, fuel and reactor services for both naval defense programs and commercial power plants. It builds the reactors that power submarines and aircraft carriers as well as small modular designs."],

  FSLR:["First Solar","Solar manufacturing","First Solar manufactures thin-film cadmium-telluride solar panels at US factories and supplies utility-scale projects. Its panels avoid the polysilicon supply chain and are sold mainly to large developers."],
  ENPH:["Enphase Energy","Solar equipment","Enphase makes microinverters and battery systems for residential solar, converting the DC power panels produce into usable household AC. Its equipment also provides home energy management and backup."],
  SEDG:["SolarEdge","Solar equipment","SolarEdge builds power optimizers and inverters for residential and commercial solar installations. Its systems monitor and optimise each panel's output and pair with home battery storage."],
  RUN:["Sunrun","Residential solar","Sunrun installs and finances residential solar systems, often through leases and power agreements rather than outright sales. It also sells home battery storage and bundles solar with backup power."],

  DAR:["Darling Ingredients","Biofuel feedstock","Darling Ingredients collects and renders animal byproducts into ingredients, including feedstocks for renewable diesel and biodiesel. Its fats and used cooking oil are key inputs to low-carbon fuel production."],
  GPRE:["Green Plains","Ethanol","Green Plains operates ethanol plants that ferment corn into fuel alcohol and also produce protein feed and corn oil. Its ethanol is blended into the gasoline supply, mainly in the US Midwest."],
  BEP:["Brookfield Renewable","Renewable power","Brookfield Renewable owns and operates hydro, wind and solar generation assets across several continents. It sells power under long-term contracts and holds a large development pipeline."],

  ENB:["Enbridge","Pipelines","Enbridge operates crude oil and liquids pipelines plus natural gas transmission and distribution networks across North America. Its systems move the bulk of Canadian crude exports to US refineries and terminals."],
  KMI:["Kinder Morgan","Pipelines","Kinder Morgan owns natural gas pipelines plus products pipelines, terminals and CO2 infrastructure. Its network gathers, transports and stores energy commodities under long-term, fee-based contracts."],
  WMB:["Williams","Gas infrastructure","Williams gathers, processes and transports natural gas through interstate pipelines, mostly in the US East and Gulf Coast. Its systems link shale production to power plants, LNG terminals and industrial users."],
  OKE:["ONEOK","NGL infrastructure","ONEOK owns natural gas liquids and natural gas pipelines along with processing and fractionation plants. It gathers raw gas, separates the liquids and delivers them to petrochemical and export markets."],
  ET:["Energy Transfer","Midstream","Energy Transfer is a midstream operator running pipelines, storage and processing for natural gas, gas liquids and crude oil. Its footprint spans the Permian, Gulf Coast and the eastern US."],
  LNG:["Cheniere Energy","LNG export","Cheniere Energy operates the Sabine Pass and Corpus Christi LNG terminals, making it a top US exporter of liquefied natural gas. It buys gas, cools it into liquid and ships it to overseas buyers."],
  NFE:["New Fortress Energy","LNG terminals","New Fortress Energy builds LNG liquefaction, terminals and gas-fired power plants for emerging markets. It takes gas to places without pipeline access and converts it to power locally."],

  VLO:["Valero Energy","Refining","Valero is the largest independent refiner in the US, turning crude oil into gasoline, diesel and other fuels. It also produces ethanol and renewable diesel and exports refined products worldwide."],
  MPC:["Marathon Petroleum","Refining + retail","Marathon Petroleum refines crude oil into fuels and runs the largest US fuel retail network through its branded stations. It also holds midstream stakes in pipelines and terminals."],
  PSX:["Phillips 66","Refining + chemicals","Phillips 66 refines crude into fuels, operates midstream pipelines and terminals, and makes petrochemicals through its CPChem joint venture. It also markets lubricants and has a growing renewable fuels business."],
  PBF:["PBF Energy","Refining","PBF Energy is an independent refiner with plants on the US East and West Coasts and in the Gulf region. It also owns logistics assets and produces renewable fuels at some sites."],
  DOW:["Dow Inc.","Petrochemicals","Dow makes plastics, industrial intermediates, silicones and coatings from hydrocarbon feedstocks. Its products go into packaging, construction, electronics and consumer goods."],
  LYB:["LyondellBasell","Petrochemicals","LyondellBasell produces olefins and polyolefins, making plastics from refinery- and gas-derived feedstocks. It is one of the world's largest producers of polyethylene and polypropylene."],

  NEE:["NextEra Energy","Utility + renewables","NextEra Energy is the largest US regulated utility holding, serving Florida, and the world's biggest developer of wind and solar. It builds renewables for its own utilities and for third-party customers."],
  CEG:["Constellation Energy","Nuclear power","Constellation Energy is the largest US nuclear power operator, running a fleet of reactors that produce carbon-free baseload electricity. It sells power to utilities, businesses and under long-term corporate agreements."],
  VST:["Vistra","Independent power","Vistra is a competitive power producer and retail supplier with a large fleet of gas, coal and nuclear plants. It sells electricity directly to homes and businesses in deregulated markets."],
  NRG:["NRG Energy","Retail power","NRG Energy sells electricity and natural gas to homes and businesses as a competitive retail supplier. It also owns generation assets that back its retail load."],
  AES:["AES Corp","Global power","AES generates and distributes power around the world, including utility-scale renewables and battery storage. It also runs regulated utilities in several emerging markets."],

  FLNC:["Fluence Energy","Storage systems","Fluence Energy builds grid-scale battery storage systems and supplies the software that manages them. Its projects let utilities and developers store and shift power on the grid."],
  TSLA:["Tesla","Storage + EVs","Tesla makes electric vehicles and, on the energy side, battery storage products like the utility-scale Megapack and residential Powerwall. It also sells solar systems and operates charging networks."],
  ALB:["Albemarle","Lithium","Albemarle produces lithium for batteries, largely from brine and hard-rock operations in Australia, Chile and the US. It also makes bromine specialties and refinery catalysts."],
  PLUG:["Plug Power","Hydrogen","Plug Power makes hydrogen fuel cells and electrolyzers and produces green hydrogen for industrial and transport customers. Its equipment powers forklifts, data centers and backup generation."],

  DUK:["Duke Energy","Regulated utility","Duke Energy is a regulated electric and gas utility serving customers in the Carolinas, Florida and the Midwest. It generates and delivers power under state-regulated rates."],
  SO:["Southern Company","Regulated utility","Southern Company is a regulated utility holding with electric and gas service across the southeastern US. Its subsidiaries include Georgia Power and Alabama Power."],
  D:["Dominion Energy","Regulated utility","Dominion Energy provides electric and gas distribution in Virginia and the Carolinas and operates regulated gas utilities. It has been shifting toward regulated utility operations and offshore wind."],
  AEP:["American Electric Power","Regulated utility","American Electric Power is a regulated electric utility serving 11 states and one of the largest US transmission owners. It generates power and delivers it over an extensive grid."],
  EXC:["Exelon","Wires-only utility","Exelon is a wires-only utility: it owns transmission and distribution networks such as ComEd, PECO and BGE but no power generation. It earns regulated returns on delivering electricity and gas."],
  SRE:["Sempra","Utility + LNG","Sempra is a utility holding that owns San Diego Gas & Electric and SoCalGas, plus energy infrastructure in Mexico and LNG projects on the Gulf Coast. It combines regulated distribution with export-linked growth."],
  NI:["NiSource","Regulated utility","NiSource is a regulated gas and electric distribution utility operating across several Midwest states. Its largest business is natural gas service to homes and businesses."],
  ATO:["Atmos Energy","Gas distribution","Atmos Energy is the largest pure-play natural gas distribution utility in the US, serving millions of customers across several states. It delivers gas for heating and industrial use under regulated rates."],

  SLB:["SLB","Oilfield services","SLB (formerly Schlumberger) is the world's largest oilfield services company, providing drilling, completions, production and digital technology to producers. It operates in nearly every major oil and gas basin."],
  HAL:["Halliburton","Oilfield services","Halliburton provides cementing, stimulation, completions and drilling services to oil and gas producers. It is a major hydraulic-fracturing contractor, especially in North America."],
  BKR:["Baker Hughes","Oilfield + equipment","Baker Hughes supplies oilfield equipment and services and also makes industrial gas turbines and power equipment. It serves both the oil and gas industry and the broader energy and industrial market."],
  NOV:["NOV Inc.","Oilfield equipment","NOV Inc. builds drilling rig equipment and oilfield hardware for onshore and offshore operations. Its machinery is used by land and offshore drillers worldwide."],
  GEV:["GE Vernova","Power equipment","GE Vernova, spun off from General Electric, makes gas turbines, grid equipment and wind turbines. Its machines generate much of the world's electricity and support grid expansion."],
  ETN:["Eaton","Electrical equipment","Eaton makes electrical grid, power management and data-center equipment such as switchgear and UPS systems. Its products manage and protect electricity from the grid to the load."],
  PWR:["Quanta Services","Grid construction","Quanta Services builds and maintains electric transmission lines, substations and grid infrastructure. It contracts with utilities to construct and upgrade the power network."],
  EMR:["Emerson Electric","Automation","Emerson Electric supplies automation and control systems for energy, power and industrial plants. Its software and hardware monitor and operate process facilities."],
  HUBB:["Hubbell","Grid hardware","Hubbell makes electrical grid and utility hardware components such as connectors, meters and enclosures. Its products go into transmission, distribution and industrial electrical systems."],

  SQM:["SQM","Lithium + chemicals","SQM produces lithium, iodine and specialty plant nutrients, largely from Chile's Atacama salt-flat brine. Its lithium feeds battery makers while its iodine goes to industrial and medical uses."],
  MP:["MP Materials","Rare earths","MP Materials mines and processes rare-earth elements at Mountain Pass in California and is building magnets for electric motors and defense. Rare earths are essential to motors, wind turbines and electronics."],
  FCX:["Freeport-McMoRan","Copper mining","Freeport-McMoRan is a major copper producer, mining the metal that wires grids, motors and data centers. It also extracts gold and molybdenum at mines in the Americas and Indonesia."],

  GOOGL:["Alphabet","Data center buyer","Alphabet operates Google's data centers and has pledged to run on round-the-clock carbon-free energy. It buys clean power heavily and has signed advanced-nuclear agreements to back its load."],
  META:["Meta Platforms","Data center buyer","Meta builds data centers for its social platforms and AI workloads and is a very large buyer of renewable power. It is now adding nuclear agreements to cover round-the-clock demand."],

  INSW:["International Seaways","Product tankers","International Seaways owns and operates crude and product tankers on international routes. Its ships move oil and refined fuels between ports worldwide."],

  NE:["Noble Corporation","Offshore drilling","Noble Corporation drills offshore oil and gas wells and is heavily focused on deepwater projects. It contracts its rigs to international and independent producers."],

    if(cur.length)rw+=CGAP; cur.push({t,w}); rw+=w;});

/* ---------- capital loop ---------- */
function roundPath(pts,r){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    const v1=[p1[0]-p0[0],p1[1]-p0[1]],v2=[p2[0]-p1[0],p2[1]-p1[1]];
    const l1=Math.hypot(v1[0],v1[1]),l2=Math.hypot(v2[0],v2[1]);
    const rr=Math.min(r,l1/2,l2/2);
    const a=[p1[0]-v1[0]/l1*rr,p1[1]-v1[1]/l1*rr];
    const b=[p1[0]+v2[0]/l2*rr,p1[1]+v2[1]/l2*rr];
    d+=` L${a[0]},${a[1]} Q${p1[0]},${p1[1]} ${b[0]},${b[1]}`;
  }
  const L=pts[pts.length-1]; return d+` L${L[0]},${L[1]}`;
}

            [60,toN.y+toN.h/2],[CX[0]-toN.w/2-2,toN.y+toN.h/2]];
el("path",{d:roundPath(loop,18),class:"edge cap","marker-end":"url(#m-cap)"},gEdge);

/* ---------- nodes ---------- */
NODES.forEach(n=>{

  const cy=n.y+26;
  el("circle",{cx:n.x-n.w/2+18,cy:cy-4,r:3.6,fill:G[n.g]},g);
  const lt=el("text",{x:n.x-n.w/2+30,y:cy,class:"node-label"},g);
  lt.textContent=n.label;
  let yy=n.y+42;
  if(n.rows.length){
    yy+=8;
    n.rows.forEach(row=>{

        cg.setAttribute("aria-label",it.t+" — "+coName(it.t));
        el("rect",{x:cx,y:yy,width:it.w,height:CH,rx:5,class:"chip-box"},cg);
        const tx=el("text",{x:cx+it.w/2,y:yy+CH/2+3.7,class:"chip-text","text-anchor":"middle"},cg);
        tx.textContent=it.t;
        bindChip(cg,it.t,n.id);
        cx+=it.w+CGAP;
      });

    });
    yy-=CGAP;
  }
  g.addEventListener("mouseenter",()=>{ if(!picked) focus(n.id); });
  g.addEventListener("mouseleave",()=>{ if(!picked) blur(); });
  /* Clicking the card itself (chips stop propagation and open the panel) pins
     this node's path. Hover previews are suppressed while something is pinned,

/* ---------- trace on hover ---------- */
function focus(id){
  const near={}; near[id]=1;
  EDGES.forEach(e=>{ if(e.a===id)near[e.b]=1; if(e.b===id)near[e.a]=1; });
  EDGES.forEach(e=>{
    const on=(e.a===id||e.b===id);
    e.el.classList.toggle("hl",on); e.el.classList.toggle("dim",!on);
    e.lbl.classList.toggle("on",on); e.lbl.classList.toggle("fade",!on);
  });
  NODES.forEach(n=>n.gEl.classList.toggle("dim",!near[n.id]));
}
function blur(){
  EDGES.forEach(e=>{e.el.classList.remove("hl","dim");
    e.lbl.classList.remove("on","fade");});
  NODES.forEach(n=>n.gEl.classList.remove("dim"));
}

let picked=null;
function bindChip(nodeEl,tk,nodeId){
  const g=byId[nodeId]?byId[nodeId].g:(ENABLERS.find(e=>e.id===nodeId)||{}).g||"svc";
  nodeEl.style.setProperty("--c",G[g]);
  nodeEl.style.setProperty("--t",TINT[g]);
  nodeEl.addEventListener("mouseenter",()=>{
    const nm=coName(tk);
    tip.innerHTML=`<span style="font-family:var(--mono);font-weight:700;color:#BFD3EA">${tk}</span>`+
      (nm===tk?"":`&nbsp;&nbsp;${nm}`);
    tip.style.opacity="1";
  });
  nodeEl.addEventListener("mousemove",ev=>{tip.style.left=ev.clientX+"px";tip.style.top=ev.clientY+"px";});
  nodeEl.addEventListener("mouseleave",()=>{tip.style.opacity="0";});

  nodeEl.addEventListener("keydown",ev=>{

/* ---------- company panel ---------- */
const panel=document.getElementById("panel");

/* Sidebar sections keep their open state when you switch company: the state is
   read off the DOM before the re-render and written back after it, so an open
   Financials stays open for the next company (and for a re-opened panel). */
const PANEL_SECS=["secFacts","secFlows","secFin","secPeers"];

function pick(tk,nodeId,chipEl){
  const wasOpen={};
  PANEL_SECS.forEach(id=>{ wasOpen[id]=$(id).open; });
  const name=coName(tk), about=coAbout(tk);
  const node=byId[nodeId]||null;
  const gcol=node?G[node.g]:G.svc;
  const D=(typeof DATA!=="undefined"&&DATA[tk])||{};
  picked={tk:tk,nodeId:nodeId};
  markPin(nodeId);
  markRailSel(tk);

  $("pTar").innerHTML=`<span class="dot" style="background:${gcol}"></span>${tk}`;
  const nmEl=$("pName");
  nmEl.textContent=(name===tk?"":name);
  nmEl.style.display=(name===tk?"none":"");
  $("pAbout").textContent=about;

  /* company facts — only what could actually be sourced */
  const ind=D.industry?D.industry.charAt(0).toUpperCase()+D.industry.slice(1):null;
  const facts=[["Listed",D.listed],["Industry",ind],["HQ",D.hq],
               ["Founded",D.founded?String(D.founded):null],
               ["Employees",D.employees?[fmtNum(D.employees),D.employeesYear]:null]];
  const fx=$("pFacts"); fx.innerHTML="";
  const rows=facts.filter(f=>f[1]);
  rows.forEach(f=>fx.appendChild(fact(f[0],f[1])));
  $("secFacts").hidden=!rows.length;

  /* financials — open state carries over from the previous company; omitted
     when nothing could be sourced */
  renderFin(tk);

  /* flows — open state carries over too */
  const flow=$("pFlows"); flow.innerHTML="";
  if(node){
    const out=EDGES.filter(e=>e.a===node.id), inn=EDGES.filter(e=>e.b===node.id);
    out.forEach(e=>flow.appendChild(row("→",byId[e.b].label,e.l)));
    inn.forEach(e=>flow.appendChild(row("←",byId[e.a].label,e.l)));
    if(!out.length&&!inn.length) flow.appendChild(muted("A terminal stage — no outgoing flows."));
  }else{
    flow.appendChild(row("→","Every stage of the chain","services · equipment · materials"));
  }

  /* direct competitors — same line of business, from data/competitors.json.
     A peer that is on the chart opens its own panel; one that is not is listed
     as plain text (the diagram has no chip to select). Open state carries over. */
  const pw=$("pPeers"); pw.innerHTML="";
  const P=(typeof PEERS!=="undefined"&&PEERS[tk])||null;
  const nPeer=(P&&P.peers)?P.peers.length:0;
  $("pPeerN").textContent=nPeer?String(nPeer):"";
  if(nPeer){
    const b=document.createElement("div"); b.className="pbasis";
    b.textContent=P.basis; pw.appendChild(b);
    P.peers.forEach(p=>pw.appendChild(peerRow(p)));
    if(P.note) pw.appendChild(muted(P.note));
    const ft=document.createElement("div"); ft.className="pfoot";
    ft.textContent=(typeof PEERS_NOTE!=="undefined")?PEERS_NOTE:"";
    pw.appendChild(ft);
  }else pw.appendChild(muted("No direct competitor identified in this segment."));
  $("secPeers").hidden=!nPeer;

  /* recent news */
  const nw=$("pNews"); nw.innerHTML="";
  const news=D.news||[];
  if(news.length) news.forEach(it=>nw.appendChild(newsItem(it)));
  else nw.appendChild(muted("No recent headlines found."));
  nw.appendChild(moreNews(name));

  /* links */
  const lk=$("pLinks"); lk.innerHTML="";
  const rowEl=document.createElement("div"); rowEl.className="lnks";
  if(D.site) rowEl.appendChild(linkOut("Website",D.site));
  if(D.wiki) rowEl.appendChild(linkOut("Wikipedia",
    "https://en.wikipedia.org/wiki/"+encodeURIComponent(D.wiki.replace(/ /g,"_"))));
  if(rowEl.childNodes.length){ lk.appendChild(rowEl); $("secLinks").hidden=false; }
  else $("secLinks").hidden=true;

  /* provenance */
  $("pAsof").textContent=(news.length
    ? `Headlines via Google News, as of ${fmtDate(NEWS_ASOF)}. `
    : "")+"Facts from Wikidata and Wikipedia.";

  document.querySelectorAll(".chip.sel").forEach(c=>c.classList.remove("sel"));
  chipEl.classList.add("sel");
  if(node) focus(node.id); else blur();
  /* re-apply the section state captured at the top of pick() — hidden sections
     keep it silently so the next company that has data reopens them */
  PANEL_SECS.forEach(id=>{ const s=$(id); if(!s.hidden) s.open=wasOpen[id]; });
  panel.classList.add("open");
  document.body.classList.add("panelopen");
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(s){
  const p=String(s||"").split("-");
  return p.length===3?((+p[2])+" "+MON[(+p[1])-1]+" "+p[0]):(s||"");
}
function fmtNum(n){ return Number(n).toLocaleString("en-US"); }
function fact(k,v){
  const d=document.createElement("div"); d.className="fact";
  const a=document.createElement("span"); a.className="k"; a.textContent=k;
  const b=document.createElement("span"); b.className="v";
  if(Array.isArray(v)){
    b.textContent=v[0];
    if(v[1]){ const y=document.createElement("span"); y.className="yr";
      y.textContent=" "+v[1]; b.appendChild(y); }
  } else b.textContent=v;
  d.append(a,b); return d;
}
/* ---------- financials ----------
   Each row is omitted when its input is null, so a company with negative
   earnings simply has no P/E row instead of a fabricated one. Values are read
   from stockanalysis.com statements/quotes and FRED, or computed from those
   inputs; the footnote states the model's assumptions. Peer medians compare
   only the companies drawn in the same stage of the chain. */
const MUL=v=>v==null?null:(Math.abs(v)>=100?v.toFixed(0):v.toFixed(1))+"\u00d7";
const RAT=v=>v==null?null:(Math.abs(v)>=10?v.toFixed(1):v.toFixed(2))+"\u00d7";
const sgn=(v,d)=>(v<0?"-":"+")+Math.abs(v*100).toFixed(d==null?1:d)+"%";
const PCT=v=>v==null?null:sgn(v);
const PCX=v=>v==null?null:(v<0?"-":"")+Math.abs(v*100).toFixed(1)+"%";
const USH=v=>v==null?null:"$"+(Math.abs(v)>=100?v.toFixed(0):v.toFixed(2));
const ORD=n=>(["","1st","2nd","3rd"][n]||n+"th");
function renderFin(tk){
  const F=(typeof FIN!=="undefined"&&FIN[tk])||null;
  const M=(typeof FIN_META!=="undefined"&&FIN_META)||{};
  const box=$("pFin"), sec=$("secFin");
  box.innerHTML="";
  sec.hidden=!F;
  if(!F) return;
  const h=(M.dgs10!=null&&M.erp!=null)?M.dgs10+M.erp:null;
  const moat=(F.roicM!=null&&h!=null)?F.roicM-h:null;
  const dv=(F.dcfV!=null&&F.p)?F.dcfV/F.p-1:null;
  const rank=F.peerRank?ORD(F.peerRank)+"/"+F.peerM:null;

  const G=[
    ["Price relative to earnings power",[
      ["P/E trailing",MUL(F.peT),"diluted, TTM"],
      ["P/E forward",MUL(F.peF),"next 12m est."],
      ["EV/EBITDA",MUL(F.evE),null],
      ["P/FCF",MUL(F.pfcf),null],
      ["FCF yield",PCX(F.fcfy),null],
      ["P/S",MUL(F.ps),"TTM revenue"],
    ]],
    ["Growth",[
      ["Revenue growth",PCT(F.revG),"TTM y/y"],
      ["Revenue 3y CAGR",PCT(F.revC3),null],
      ["EPS growth",PCT(F.epsG),"TTM y/y"],
      ["FCF growth",PCT(F.fcfG),"TTM y/y"],
      ["PEG",F.peg==null?null:F.peg.toFixed(2),null],
    ]],
    ["Profitability and quality",[
      ["Gross margin",PCX(F.gm),null],
      ["Operating margin",PCX(F.om),null],
      ["ROIC",PCX(F.roic),"after-tax EBIT / IC"],,
      ["FCF vs net income",RAT(F.fcfNi),
        F.fcfNi==null?null:(F.fcfNi>=1?"cash-backed":"below earnings")],
    ]],
    ["Balance sheet risk",[
      ["Net debt / EBITDA",RAT(F.ndE),null],
      ["Interest coverage",MUL(F.icov),"EBIT / interest"],
      ["Share count",PCT(F.shC),"a year, 5y"],
    ]],
    ["Context",[
      ["10y Treasury",M.dgs10==null?null:(M.dgs10*100).toFixed(2)+"%",
        h==null?null:"+ "+((M.erp*100).toFixed(1))+" pts = "+(h*100).toFixed(1)+"%"],
      ["Peer P/E",MUL(F.peerPe),
        F.peerM?("median"+(rank?" \u00b7 "+rank:"")+" of "+F.peerM):null],
      ["Peer EV/EBITDA",MUL(F.peerEv),F.peerN?("median, "+F.peerN+" peers"):null],
      ["5y median P/E",MUL(F.histPe),F.peT?("now "+MUL(F.peT)):null],
      ["5y median EV/EBITDA",MUL(F.histEv),F.evE?("now "+MUL(F.evE)):null],
      ["Moat",moat==null?null:(moat<0?"-":"+")+Math.abs(moat*100).toFixed(1)+" pts",
        F.roicM==null?null:"5y ROIC "+(F.roicM*100).toFixed(1)+"% vs "+(h!=null?(h*100).toFixed(1):"?")+"%"],
      ["DCF value",USH(F.dcfV),dv==null?null:PCT(dv)+" vs price"],
      ["Reverse DCF",PCT(F.rdcf),"FCF growth implied"],
    ]],
  ];
  let any=0;
  G.forEach(([title,rows])=>{
    const live=rows.filter(r=>r[1]);
    if(!live.length) return;
    any++;
    const g=document.createElement("div"); g.className="fg";
    const t=document.createElement("div"); t.className="fgh"; t.textContent=title;
    g.appendChild(t);
    live.forEach(([k,v,n])=>{
      const d=document.createElement("div"); d.className="frow2";
      const a=document.createElement("span"); a.className="k"; a.textContent=k;
      const b=document.createElement("span"); b.className="v"; b.textContent=v;
      if(n){ const s=document.createElement("span"); s.className="n"; s.textContent=n;
        b.appendChild(s); }
      d.append(a,b); g.appendChild(d);
    });
    box.appendChild(g);
  });
  if(!any){ box.appendChild(muted("No financial metrics found.")); sec.hidden=true; return; }
  const ft=document.createElement("div"); ft.className="fnote";
  ft.textContent="As of "+fmtDate(String(M.asof||"").slice(0,10))+
    ". Statements and 5-year history via stockanalysis.com, 10y Treasury via FRED. "+
    "DCF: 5 years of FCF growth (trailing 3y rate, capped at 15%), terminal "+
    (M.term!=null?(M.term*100).toFixed(1):"2.5")+"%, discount "+
    (h!=null?(h*100).toFixed(1):"?")+"% (10y + "+
    (M.erp!=null?(M.erp*100).toFixed(1):"5.0")+" pts). Peer medians cover the "+
    "companies drawn in the same stage.";
  box.appendChild(ft);
}

/* Pins are sticky: a node card click pins the trace, a chip click pins it and

/* ---------- market rail: top-volume feed + merged ticker news ----------
   Two panes over the same universe the diagram draws (NODES + ENABLERS), so a
   ticker added to the chart shows up here with no extra work.

   Volume   — the VOL snapshot (tools/fetch-market-volume.py) ranked by shares
              traded today, label with the market timestamp it came from.
   News     — every dated headline in DATA[tk].news, merged, de-duplicated and
              ordered by source tier then recency ("Priority") or purely by date
              ("Newest"), filterable to any one ticker.
   A row or a ticker chip opens the same company panel a chip click does. */
const VOLQ=(typeof VOL!=="undefined")?VOL:{};
const VOL_TS=(typeof VOL_ASOF!=="undefined")?VOL_ASOF:"";
const VOL_ST=(typeof VOL_STATUS!=="undefined")?VOL_STATUS:"";
const RAIL={vol:$("volList"),news:$("newsList"),asof:$("volAsOf")};
/* ticker → owning node id for the ACTIVE view, in chart order. Rebuilt by
   buildRailData() on every tab change, so the feed never lists a ticker the
   diagram is not drawing. */
function buildRailData(){
  const map={},order=[];
  NODES.forEach(n=>n.cos.forEach(t=>{ if(!(t in map)){map[t]=n.id;order.push(t);} }));
  ENABLERS.forEach(g=>g.cos.forEach(t=>{ if(!(t in map)){map[t]=g.id;order.push(t);} }));
  CHART_TK={map:map,order:order};
  NEWS.length=0;
  order.forEach(tk=>{
    const D=(typeof DATA!=="undefined"&&DATA[tk])||{};
    (D.news||[]).forEach(n=>NEWS.push({tk:tk,ti:n.t,s:n.s||"",d:n.d||"",u:n.u}));
  });
  dedupeNews();
}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TNAME=t=>((typeof DATA!=="undefined"&&DATA[t]&&DATA[t].name)||
  (VOLQ[t]&&VOLQ[t].n)||(CO[t]&&CO[t][0])||t);
const fmtVol=n=>n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":
  n>=1e3?(n/1e3).toFixed(1)+"K":String(n);

/* Selecting from the rail: drive the panel exactly like a chip click, and
   outline the matching chip so the diagram agrees with the feed. */
function openCompany(tk){
  const id=CHART_TK.map[tk];
  if(id===undefined) return;
  /* clicking the company that is already open toggles the panel shut */
  if(picked&&picked.tk===tk){ clearSel(); return; }
  pick(tk,id,document.createElement("span"));   // detached: the panel needs no chip
  document.querySelectorAll(".chip").forEach(c=>{
    if((c.getAttribute("aria-label")||"").indexOf(tk+" — ")===0) c.classList.add("sel");
  });
  /* on a narrow screen the rail is an overlay: step it aside so the panel
     (which is wider and sits above it) is the only thing on show */
  if(MQ.matches){ setRail(true); }
}

/* ---------- pane 1: most volume right now ---------- */
function fmtAsof(){
  const d=new Date(VOL_TS);
  if(isNaN(d.getTime())) return "Top volume";
  const t=d.toLocaleTimeString("en-US",{timeZone:"America/New_York",
    hour:"numeric",minute:"2-digit",timeZoneName:"short"});
  const dd=d.toLocaleDateString("en-US",{timeZone:"America/New_York",
    day:"numeric",month:"short"});
  const st=(VOL_ST&&VOL_ST!=="REG_MKT")?" · "+VOL_ST.replace(/_/g," ").toLowerCase():"";
  return "Top volume · as of "+t+", "+dd+st;
}
function renderVol(){
  const all=Object.keys(VOLQ).filter(t=>CHART_TK.map[t]!==undefined)
    .map(t=>({t:t,q:VOLQ[t]})).sort((a,b)=>b.q.v-a.q.v);
  RAIL.vol.innerHTML="";
  if(!all.length){
    const e=document.createElement("div"); e.className="nempty";
    e.textContent="No volume snapshot — run tools/fetch-market-volume.py --inject.";
    RAIL.vol.appendChild(e); return;
  }
  const max=all[0].q.v, frag=document.createDocumentFragment();
  all.forEach((r,i)=>{
    const q=r.q;
    const pc=(q.c===undefined||q.c===null)?"—":((q.c>0?"+":"")+q.c.toFixed(2)+"%");
    const cls=(q.c===undefined||q.c===null||Math.abs(q.c)<0.005)?"flat":(q.c>0?"up":"dn");
    const b=document.createElement("button");
    b.type="button"; b.className="vrow"; b.dataset.tk=r.t;
    b.title=r.t+" · "+(q.p!=null?"$"+q.p.toFixed(2)+" · ":"")+(q.x||"");
    b.setAttribute("aria-label",r.t+" — "+TNAME(r.t)+", volume "+(q.va||fmtVol(q.v)));
    b.innerHTML='<span class="vrk">'+(i+1)+'</span>'+
      '<span class="vtk">'+esc(r.t)+'</span>'+
      '<span class="vnm">'+esc(TNAME(r.t))+'</span>'+
      '<span class="vfoot"><span class="vbar"><i style="width:'+
      Math.max(2,Math.round(q.v/max*100))+'%"></i></span>'+
      '<span class="vvol">'+esc(q.va||fmtVol(q.v))+'</span>'+
      '<span class="vchg '+cls+'">'+pc+'</span></span>';
    b.addEventListener("click",()=>openCompany(r.t));
    frag.appendChild(b);
  });
  RAIL.vol.appendChild(frag);
  markRailSel(picked&&picked.tk);
}

/* ---------- pane 2: merged news over every ticker the active view draws ---------- */
const TIER1=/reuters|bloomberg|wall street journal|\bwsj\b|financial times|associated press|\bbarron|new york times|\bnyt\b|washington post|\bcnbc\b|dow jones|the economist/i;
const TIER2=/yahoo|marketwatch|seeking alpha|motley fool|investor's business daily|investopedia|benzinga|zacks|simply wall|business wire|pr newswire|globe ?newswire|oilprice|s&p global|spglobal|utility ?dive|the street|tipranks|insider monkey|forbes|fortune|\bcnn\b|\bbbc\b|streetinsider|oil & gas journal|rigzone|world oil|hydrogen insight|canary media|power magazine|pv magazine|electrek|heatmap|axios|the hill|financial post|energy monitor|argus|hart energy|rbn energy|the wall street|marketwire/i;
const T_NOW=VOL_TS.slice(0,10);
const srcTier=s=>TIER1.test(s)?3:(TIER2.test(s)?2:1);
function ageD(ds){ const a=Date.parse(T_NOW),b=Date.parse(ds);
  return (isNaN(a)||isNaN(b))?999:Math.max(0,Math.round((a-b)/864e5)); }
const prio=n=>srcTier(n.s)*1000-ageD(n.d);
const sigOf=n=>n.ti.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
/* keep one copy of a story: the best-sourced, newest one */
function dedupeNews(){
  const best={};
  NEWS.forEach(n=>{ const k=sigOf(n);
    if(!best[k]||prio(n)>prio(best[k])) best[k]=n; });
  const keep=new Set(Object.values(best));
  for(let i=NEWS.length-1;i>=0;i--) if(!keep.has(NEWS[i])) NEWS.splice(i,1);
}
const NST={q:"",sort:"pri",limit:40};
function newsPick(){
  const q=NST.q.trim().toLowerCase();
  const list=NEWS.filter(n=>!q||n.tk.toLowerCase().indexOf(q)===0||
    TNAME(n.tk).toLowerCase().includes(q));
  list.sort(NST.sort==="new"
    ? (a,b)=>a.d<b.d?1:(a.d>b.d?-1:0)
    : (a,b)=>prio(b)-prio(a)||(a.d<b.d?1:(a.d>b.d?-1:0)));
  return list;
}
function renderNews(){
  const list=newsPick();
  RAIL.news.innerHTML="";
  if(!list.length){
    const e=document.createElement("div"); e.className="nempty";
    e.textContent=NST.q?("No headlines for “"+NST.q+"”."):"No recent headlines.";
    RAIL.news.appendChild(e); return;
  }
  const shown=list.slice(0,NST.limit), frag=document.createDocumentFragment();
  shown.forEach(n=>{
    const d=document.createElement("div"); d.className="nrow";
    const a=document.createElement("a"); a.className="nt";
    a.href=n.u; a.target="_blank"; a.rel="noopener"; a.textContent=n.ti;
    const m=document.createElement("div"); m.className="nmeta";
    const b=document.createElement("button"); b.type="button"; b.className="ntk";
    b.dataset.tk=n.tk;
    b.textContent=n.tk; b.title="Open "+n.tk+" — "+TNAME(n.tk);
    b.addEventListener("click",()=>openCompany(n.tk));
    const s=document.createElement("span");
    s.textContent=[n.s,fmtDate(n.d)].filter(Boolean).join(" · ");
    m.append(b,s); d.append(a,m); frag.appendChild(d);
  });
  RAIL.news.appendChild(frag);
  if(list.length>shown.length){
    const more=document.createElement("button");
    more.type="button"; more.className="nmore";
    more.textContent="Show "+Math.min(40,list.length-shown.length)+
      " more of "+list.length+" headlines";
    more.addEventListener("click",()=>{ NST.limit+=40; renderNews(); });
    RAIL.news.appendChild(more);
  }
  markRailSel(picked&&picked.tk);
}

/* ---------- theme ----------
   data-theme is already on <html> (head script). applyTheme() only re-points
   the JS palettes and the button glyph; setTheme() also redraws, because the
   generated SVG bakes group colors into fills and arrowhead markers. */
const THEME_KEY="evc-theme", TBTN=$("themeToggle");
const PALETTE=window.matchMedia("(prefers-color-scheme:dark)");
function applyTheme(t){
  const dark=t==="dark";
  document.documentElement.dataset.theme=dark?"dark":"light";
  G=PAL[dark?"dark":"light"].G; TINT=PAL[dark?"dark":"light"].TINT;
  TBTN.textContent=dark?"\u2600":"\u263e";
  const label=dark?"Switch to light theme":"Switch to dark theme";
  TBTN.title=label; TBTN.setAttribute("aria-label",label);
  TBTN.setAttribute("aria-pressed",dark?"true":"false");
}
function setTheme(t){
  applyTheme(t);
  try{localStorage.setItem(THEME_KEY,t)}catch(e){}
  const pin=picked?Object.assign({},picked):null;
  buildView(VIEW.tab);
  /* a redraw clears the selection: put the open company back */
  if(pin&&pin.tk) openCompany(pin.tk);
  else if(pin&&pin.nodeId) pinNode(pin.nodeId);
}
